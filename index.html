","The fist travels upward and forward in a short arc."],["Contact","The punch lands under the ribs or on the stomach with a neutral wrist."],["Retract and reset","Return the hand and regain a balanced guard."]],"phaseAr":"لكمة صاعدة تحت الأضلاع بعد خفض أعمق","forceAr":"يدعم الدفع من الأرض وحركة الورك والجذع دفعة القبضة إلى أعلى وأمام نحو الهدف. ويؤثر الهدف بقوة التلامس المعاكسة.","stepsAr":[["وقفة الحراسة","اليدان مرفوعتان والذقن لأسفل والركبتان مرنتان والوزن متزن."],["الخفض العميق","تنخفض الركبتان والجذع أكثر من اللكمة الصاعدة إلى الرأس مع نزول الكتف نحو جهة اللكمة."],["الدفع والدوران","تمتد الرجلان ويدور الوركان مع بقاء المرفق مثنيا قرب الأضلاع."],["الصعود","تتحرك القبضة إلى أعلى وإلى الأمام في قوس قصير."],["التلامس","تصل اللكمة تحت الأضلاع أو إلى البطن والرسغ في وضع محايد."],["السحب والعودة","أعد اليد واستعد حراسة متزنة."]],"movesAr":[["مد الورك والركبة، والثني الأخمصي للكاحل","سهمي","عرضي من جانب إلى جانب"],["دوران الورك والجذع","مستعرض","رأسي، طولي"],["الذراع الصاعدة: ثني الكتف مع ثني المرفق","سهمي أو مائل","تقريب لمحور عرضي، يختلف حسب الأداء"]],"about":"A rising punch that goes under the ribs or into the stomach from a deep dip. It works well at close range.","aboutAr":"لكمة صاعدة تذهب تحت الأضلاع أو إلى البطن من خفض عميق. تفيد في المسافة القريبة."},{"id":"slip","sport":"Boxing","name":"Slip","ar":"تفادي اللكمة بالميل (سليب)","aliases":"slipping slip left slip right سليب","phase":"Small head displacement away from a straight punch","primary":["obliques","quads","glutes"],"secondary":["abs","lowback","glute-deep","calves"],"moves":[["Trunk side-bend and hip/knee adjustment","Frontal plus sagittal components","Anteroposterior plus mediolateral"],["Small trunk/hip turn, when used","Transverse","Vertical (longitudinal)"]],"force":"The feet exchange forces with the floor to shift and control the body. There is no intended punch-to-target contact force in this defensive action.","diagram":"side","steps":[["Guard stance","Hands up, chin down, knees soft."],["Read","Notice the straight punch."],["Move","Small knee bend and trunk rotation shift the head off the centre line."],["Pass","The punch travels past the head."],["Return","Bring the head back to centre."],["Guard","Reset the stance and hands."]],"phaseAr":"إزاحة صغيرة للرأس بعيدا عن لكمة مستقيمة","forceAr":"تتبادل القدمان القوى مع الأرض لنقل الجسم والتحكم فيه. لا توجد قوة تلامس مقصودة بين لكمة وهدف في هذه الحركة الدفاعية.","stepsAr":[["وقفة الحراسة","اليدان مرفوعتان والذقن لأسفل والركبتان مرنتان."],["القراءة","لاحظ اللكمة المستقيمة."],["الحركة","يزحزح ثني بسيط للركبة ودوران الجذع الرأس عن خط المنتصف."],["المرور","تمر اللكمة بجانب الرأس."],["العودة","أعد الرأس إلى المنتصف."],["الحراسة","أعد وضع القدمين واليدين."]],"movesAr":[["الثني الجانبي للجذع وتعديل الورك والركبة","مكونات جبهية وسهمية","أمامي خلفي وعرضي"],["دوران بسيط للجذع والورك عند استخدامه","مستعرض","رأسي، طولي"]],"about":"A defensive move: a small shift of the head to the side so a punch passes by, without moving the feet much.","aboutAr":"حركة دفاعية: إزاحة صغيرة للرأس للجانب لتمر اللكمة بجانبه دون تحريك القدمين كثيرا."},{"id":"bob-weave","sport":"Boxing","name":"Bob and weave","ar":"التفادي بالانخفاض والمرور (بوب آند ويف)","aliases":"bob weave roll duck bobbing weaving bob & weave بوب اند ويف","phase":"Lower, move under the imagined punch, then rise","primary":["quads","glutes","obliques"],"secondary":["hams","calves","abs","lowback","glute-deep"],"moves":[["Lower and rise: hip/knee flexion and extension","Sagittal","Mediolateral (side to side)"],["Lateral shift and optional trunk rotation","Frontal and transverse components","Anteroposterior and vertical"]],"force":"Ground reaction supports and redirects the body during lowering, lateral shift and rising. Gravity acts downward; no punch impact is assumed.","diagram":"side","steps":[["Guard stance","Hands up, chin down, balanced."],["Read","Notice the imagined punch."],["Bend and lower","Knees bend and the trunk drops under the punch."],["Weave","Move along a small U-shaped path to the opposite side."],["Rise","Legs extend as the trunk comes up."],["Face and reset","Return to a balanced guard facing forward."]],"phaseAr":"الخفض والمرور تحت اللكمة المتخيلة ثم الارتفاع","forceAr":"يدعم رد فعل الأرض الجسم ويغير اتجاهه أثناء الخفض والانتقال الجانبي والارتفاع. تؤثر الجاذبية إلى أسفل، ولا يفترض حدوث اصطدام بلكمة.","stepsAr":[["وقفة الحراسة","اليدان مرفوعتان والذقن لأسفل والتوازن ثابت."],["القراءة","لاحظ اللكمة المتخيلة."],["الثني والخفض","تنثني الركبتان وينخفض الجذع تحت اللكمة."],["المراوغة","تحرك في مسار صغير يشبه حرف يو إلى الجانب المقابل."],["الارتفاع","تمتد الرجلان مع ارتفاع الجذع."],["المواجهة والعودة","عد إلى حراسة متزنة مع مواجهة الأمام."]],"movesAr":[["الخفض والارتفاع: ثني الورك والركبة ومدهما","سهمي","عرضي من جانب إلى جانب"],["انتقال جانبي ودوران اختياري للجذع","مكونات جبهية ومستعرضة","أمامي خلفي ورأسي"]],"about":"A defensive move: duck under a punch and move to the other side in a U-shape, then come back up ready to counter.","aboutAr":"حركة دفاعية: الانخفاض تحت اللكمة ثم الانتقال للجانب الآخر في مسار على شكل U والعودة للأعلى جاهزا للرد."},{"id":"hb-jump-shot","sport":"Handball","name":"Handball jump shot","ar":"التصويب بالارتقاء في كرة اليد","aliases":"handball shoot throw jump shot overarm","phase":"Take-off through ball release","primary":["quads","glutes","calves","delt-f","chest","obliques"],"secondary":["triceps","forearms","abs","serratus","lats","rotator"],"moves":[["Take-off: hip and knee extension, ankle plantarflexion","Sagittal","Mediolateral (side to side)"],["Trunk rotation and arm cocking then acceleration: shoulder internal rotation, elbow extension","Transverse and sagittal approximation","Vertical (longitudinal); shoulder axes vary"]],"force":"The legs push down and receive an upward ground reaction. The throwing hand accelerates the ball forward and slightly up. After release gravity acts downward on the ball.","diagram":"upforward","steps":[["Ready","Balanced stance, ball held in the throwing hand near the shoulder."],["Run-up","Two or three quick steps toward the goal."],["Take-off","The plant leg drives upward while the opposite knee lifts."],["Cocking in the air","The throwing arm moves back and the trunk rotates away from the target."],["Throw","Hips, trunk, shoulder and elbow accelerate in sequence and the ball is released overarm."],["Landing","Land on one or both feet and absorb through the ankles, knees and hips."],["Reset","Regain balance and move to defence or the next play."]],"phaseAr":"من الارتقاء حتى إطلاق الكرة","forceAr":"تدفع الرجلان إلى أسفل وتحصلان على رد فعل من الأرض إلى أعلى. تسرع يد الرمي الكرة إلى الأمام وأعلى قليلا. بعد الإطلاق تؤثر الجاذبية إلى أسفل في الكرة.","stepsAr":[["الاستعداد","وقفة متزنة والكرة بيد الرمي قرب الكتف."],["الاقتراب","خطوتان أو ثلاث خطوات سريعة نحو المرمى."],["الارتقاء","تدفع رجل الارتكاز إلى أعلى مع رفع الركبة المقابلة."],["المرجحة الخلفية في الهواء","ترجع ذراع الرمي ويدور الجذع بعيدا عن الهدف."],["الرمي","يتسارع الوركان ثم الجذع فالكتف فالمرفق بالتتابع، وتطلق الكرة من فوق الكتف."],["الهبوط","اهبط على قدم أو قدمين وامتص الصدمة بالكاحلين والركبتين والوركين."],["إعادة الاستعداد","استعد توازنك وانتقل للدفاع أو الحركة التالية."]],"movesAr":[["الارتقاء: مد الورك والركبة، والثني الأخمصي للكاحل","سهمي","عرضي من جانب إلى جانب"],["دوران الجذع ومرجحة الذراع للخلف ثم تسارعها: الدوران الداخلي للكتف ومد المرفق","تقريب للمستويين المستعرض والسهمي","رأسي طولي، مع اختلاف محاور الكتف"]],"about":"A shot at the goal taken in the air, from outside the goal area. The jump gives height and the throwing arm whips the ball forward.","aboutAr":"تسديدة نحو المرمى في الهواء من خارج منطقة المرمى. تمنح القفزة ارتفاعا وتقذف ذراع الرمي الكرة للأمام."},{"id":"hb-overarm-pass","sport":"Handball","name":"Handball overarm pass","ar":"تمريرة كرة اليد من فوق الكتف","aliases":"handball pass throw overhand","phase":"Cocking through ball release","primary":["delt-f","chest","triceps","obliques"],"secondary":["lats","forearms","abs","glutes","quads","rotator","serratus"],"moves":[["Trunk and hip rotation","Transverse","Vertical (longitudinal)"],["Shoulder internal rotation, elbow extension, wrist flexion","Sagittal and transverse approximation","Varies with arm position"]],"force":"Ground force from the back foot passes through the hips and trunk to the hand, which pushes the ball forward. The ball is pushed forward by the fingers at release.","diagram":"forward","steps":[["Ready","Balanced stance, ball in the throwing hand."],["Step and cock","Step toward the target; the throwing arm moves back and the trunk rotates."],["Hip and trunk rotation","The hips rotate first, then the trunk."],["Throw","The shoulder rotates and the elbow extends; the ball is released forward."],["Follow-through","The arm continues across the body."],["Recover","Rebalance the feet and return to the ready stance."]],"phaseAr":"من المرجحة الخلفية حتى إطلاق الكرة","forceAr":"تنتقل القوة من الأرض عبر القدم الخلفية والوركين والجذع إلى اليد التي تدفع الكرة أماما. وتدفع الأصابع الكرة إلى الأمام عند الإطلاق.","stepsAr":[["الاستعداد","وقفة متزنة والكرة بيد الرمي."],["الخطوة والمرجحة الخلفية","اخط نحو الهدف، مع رجوع ذراع الرمي ودوران الجذع."],["دوران الورك والجذع","يدور الوركان أولا ثم الجذع."],["الرمي","يدور الكتف ويمتد المرفق وتطلق الكرة أماما."],["المتابعة","تستمر الذراع عبر الجسم."],["العودة","أعد توازن القدمين وعد إلى وقفة الاستعداد."]],"movesAr":[["دوران الجذع والورك","مستعرض","رأسي، طولي"],["الدوران الداخلي للكتف ومد المرفق وثني الرسغ","تقريب للمستويين السهمي والمستعرض","يختلف حسب وضع الذراع"]],"about":"A long pass thrown over the shoulder. The trunk rotates and the arm whips forward to send the ball fast and far.","aboutAr":"تمريرة طويلة من فوق الكتف. يدور الجذع وتندفع الذراع للأمام لإرسال الكرة بسرعة إلى مسافة بعيدة."},{"id":"hb-goalkeeper-save","sport":"Handball","name":"Handball goalkeeper save","ar":"تصدي حارس المرمى في كرة اليد","aliases":"handball goalie keeper block save","phase":"Lateral push and reach","primary":["glute-deep","adductors","quads","delt-f"],"secondary":["glutes","calves","abs","obliques","forearms","lats"],"moves":[["Lateral hip and knee extension and abduction/adduction control","Coronal","Anteroposterior (front to back)"],["Shoulder abduction or flexion to reach","Coronal or sagittal","Anteroposterior (front to back) or mediolateral"]],"force":"The push-off leg sends the body sideways and receives a ground reaction in the opposite direction. The ball applies a force on the hand or body during the save.","diagram":"side","steps":[["Ready","Wide, low stance with hands and arms spread."],["Read","Watch the shooter and the ball."],["Push off","The leg opposite the ball side pushes the body toward the shot."],["Reach or block","Arm and leg extend to cover the goal area."],["Contact","Block the ball with the hand, arm, or body."],["Recover","Rise or push back to the central ready position."]],"phaseAr":"الدفع الجانبي والمد","forceAr":"ترسل رجل الدفع الجسم جانبيا وتحصل على رد فعل من الأرض في الاتجاه المقابل. تؤثر الكرة بقوة في اليد أو الجسم أثناء التصدي.","stepsAr":[["الاستعداد","وقفة واسعة ومنخفضة مع فتح اليدين والذراعين."],["القراءة","راقب المصوب والكرة."],["الدفع","تدفع الرجل المقابلة لجهة الكرة الجسم نحو التصويبة."],["المد أو الصد","تمتد الذراع والرجل لتغطية مساحة المرمى."],["التلامس","صد الكرة باليد أو الذراع أو الجسم."],["العودة","انهض أو ادفع جسمك للعودة إلى وضع الاستعداد في المنتصف."]],"movesAr":[["المد الجانبي للورك والركبة والتحكم في التبعيد والتقريب","إكليلي","أمامي خلفي"],["تبعيد الكتف أو ثنيه للوصول","إكليلي أو سهمي","أمامي خلفي أو عرضي"]],"about":"The goalkeeper pushes sideways and reaches with an arm or leg to stop a shot. Speed and reach matter most.","aboutAr":"يدفع الحارس جسمه جانبيا ويمد ذراعه أو رجله لصد التسديدة. السرعة ومدى الوصول هما الأهم."},{"id":"vb-serve","sport":"Volleyball","name":"Volleyball overhand serve","ar":"إرسال الكرة الطائرة","aliases":"volleyball serve float jump serve","phase":"Toss through contact","primary":["delt-f","chest","triceps","obliques"],"secondary":["abs","lats","forearms","serratus","quads","glutes","rotator"],"moves":[["Arm cocking and swing: shoulder extension/external rotation then flexion/internal rotation","Sagittal and transverse approximation","Mediolateral and vertical; varies"],["Trunk rotation","Transverse","Vertical (longitudinal)"]],"force":"The server pushes into the floor, swings the arm to the ball and the hand pushes the ball forward and upward. Gravity acts downward on the ball between toss and contact.","diagram":"upforward","steps":[["Ready","Balanced stance behind the end line, ball held in front."],["Toss","The ball is tossed above the hitting shoulder."],["Cock","The hitting arm draws back, chest opens, weight shifts to the rear foot."],["Swing","Weight moves forward and the arm accelerates."],["Contact","The hand strikes the ball."],["Follow-through","The arm finishes forward."],["Reset","Step into court and return to a ready stance."]],"phaseAr":"من قذف الكرة حتى ضربها","forceAr":"يضغط المرسل على الأرض ويمرجح الذراع نحو الكرة فتدفعها اليد إلى الأمام وأعلى. تؤثر الجاذبية إلى أسفل بين القذف والضرب.","stepsAr":[["الاستعداد","وقفة متزنة خلف خط النهاية والكرة ممسوكة أمام الجسم."],["قذف الكرة","تقذف الكرة فوق كتف الضرب."],["المرجحة الخلفية","ترجع ذراع الضرب وينفتح الصدر وينتقل الوزن للقدم الخلفية."],["المرجحة","ينتقل الوزن إلى الأمام وتتسارع الذراع."],["الضرب","تضرب اليد الكرة."],["المتابعة","تنتهي الذراع أمام الجسم."],["إعادة الاستعداد","ادخل الملعب وعد إلى وقفة الاستعداد."]],"movesAr":[["المرجحة الخلفية والأمامية للذراع: مد الكتف ودورانه للخارج ثم ثنيه ودورانه للداخل","تقريب للمستويين السهمي والمستعرض","عرضي ورأسي، مع الاختلاف حسب الأداء"],["دوران الجذع","مستعرض","رأسي، طولي"]],"about":"The serve starts the rally by hitting the ball over the net from behind the end line. The ball is tossed up and struck with an open hand.","aboutAr":"الإرسال يبدأ الكرة بضرب الكرة فوق الشبكة من خلف الخط الخلفي. تقذف الكرة لأعلى وتضرب بكف مفتوحة."},{"id":"vb-spike","sport":"Volleyball","name":"Volleyball spike","ar":"ضربة الكرة الطائرة الساحقة","aliases":"volleyball attack hit smash","phase":"Approach through contact","primary":["quads","glutes","calves","delt-f","chest","obliques"],"secondary":["triceps","abs","lats","forearms","hams","serratus","rotator"],"moves":[["Take-off: hip and knee extension, ankle plantarflexion","Sagittal","Mediolateral (side to side)"],["Arm cocking then hit: shoulder internal rotation, trunk rotation, elbow extension, wrist flexion","Transverse and sagittal approximation","Vertical (longitudinal) and mediolateral"]],"force":"The jump pushes down into the floor and receives an upward ground reaction. The hand drives the ball forward and downward at contact.","diagram":"downforward","steps":[["Ready","Start behind the attack line, balanced."],["Approach","Two to four steps, accelerating toward the net."],["Take-off","A braking step lowers the hips, the arms swing back and up and both legs extend."],["Arm cocking","The hitting arm draws back with the trunk rotated and the elbow high."],["Arm acceleration and contact","Trunk and arm accelerate and the hand strikes the ball."],["Follow-through and landing","The arm swings down across the body. Land on both feet and absorb through the legs."],["Reset","Return to the ready or transition position."]],"phaseAr":"من الاقتراب حتى ضرب الكرة","forceAr":"تدفع القفزة الأرض إلى أسفل وتحصل على رد فعل إلى أعلى. تدفع اليد الكرة إلى الأمام وأسفل عند الضرب.","stepsAr":[["الاستعداد","ابدأ خلف خط الهجوم مع التوازن."],["الاقتراب","خطوتان إلى أربع خطوات متسارعة نحو الشبكة."],["الارتقاء","تخفض خطوة فرملة الوركين، وتتأرجح الذراعان خلفا ثم أعلى مع مد الرجلين."],["المرجحة الخلفية للذراع","ترجع ذراع الضرب مع دوران الجذع وارتفاع المرفق."],["تسارع الذراع والضرب","يتسارع الجذع والذراع وتضرب اليد الكرة."],["المتابعة والهبوط","تتأرجح الذراع لأسفل عبر الجسم. اهبط على القدمين وامتص الصدمة بالرجلين."],["إعادة الاستعداد","عد إلى وضع الاستعداد أو الانتقال."]],"movesAr":[["الارتقاء: مد الورك والركبة، والثني الأخمصي للكاحل","سهمي","عرضي من جانب إلى جانب"],["المرجحة الخلفية ثم الضرب: الدوران الداخلي للكتف ودوران الجذع ومد المرفق وثني الرسغ","تقريب للمستويين المستعرض والسهمي","رأسي طولي وعرضي"]],"about":"A powerful attack hit. You run up, jump and strike the ball hard down into the opponent's court.","aboutAr":"ضربة هجومية قوية. تقترب بخطوات، ثم تقفز وتضرب الكرة بقوة نحو ملعب الخصم."},{"id":"vb-set","sport":"Volleyball","name":"Volleyball set","ar":"الإعداد (التمرير العالي) في الكرة الطائرة","aliases":"volleyball overhead pass setter finger pass اعداد ست","phase":"Contact through finish","primary":["triceps","delt-f","forearms"],"secondary":["chest","quads","glutes","calves","abs","traps"],"moves":[["Elbow extension, wrist and finger control","Sagittal","Mediolateral (side to side)"],["Leg extension adding force","Sagittal","Mediolateral (side to side)"]],"force":"The legs and arms apply a short upward and forward push through the fingertips. Gravity acts downward on the ball.","diagram":"upforward","steps":[["Move under the ball","Get under the ball with the hands above the forehead."],["Contact position","Fingers form a shape behind the ball and the arms are bent about 90 degrees."],["Extend","The arms extend and the wrists and fingers push through the ball as the knees finish extending."],["Release","The ball leaves the fingertips above the head toward the target."],["Recover","Return to the ready position."]],"phaseAr":"من ملامسة الكرة حتى الإنهاء","forceAr":"تنتج الرجلان والذراعان دفعة قصيرة إلى أعلى وأمام عبر أطراف الأصابع. تؤثر الجاذبية إلى أسفل في الكرة.","stepsAr":[["التحرك تحت الكرة","تحرك أسفل الكرة مع وضع اليدين فوق الجبهة."],["وضع التلامس","تتشكل الأصابع خلف الكرة وتكون الذراعان مثنيتين بزاوية تقارب 90 درجة."],["الامتداد","تمتد الذراعان ويدفع الرسغان والأصابع الكرة مع اكتمال مد الركبتين."],["إطلاق الكرة","تغادر الكرة أطراف الأصابع فوق الرأس نحو الهدف."],["العودة","عد إلى وضع الاستعداد."]],"movesAr":[["مد المرفق والتحكم في الرسغ والأصابع","سهمي","عرضي من جانب إلى جانب"],["مد الرجلين لإضافة قوة","سهمي","عرضي من جانب إلى جانب"]],"about":"A soft overhead pass with the fingertips that places the ball for a teammate to attack. Control matters more than power.","aboutAr":"تمريرة علوية ناعمة بأطراف الأصابع تضع الكرة لزميل ليهاجم. التحكم أهم من القوة."},{"id":"vb-forearm-pass","sport":"Volleyball","name":"Volleyball forearm pass","ar":"الاستقبال بالساعدين في الكرة الطائرة","aliases":"volleyball bump dig receive","phase":"Platform contact","primary":["delt-f","chest","quads","glutes","traps"],"secondary":["forearms","calves","hams","abs","serratus"],"moves":[["Shoulder flexion; legs extend for a small push","Sagittal","Mediolateral (side to side)"]],"force":"The platform formed by the forearms redirects the ball. A small upward leg push controls the angle. Gravity acts downward on the ball.","diagram":"upforward","steps":[["Ready","Low stance, weight on the balls of the feet, arms relaxed."],["Move behind the ball","Move to get behind the ball line with a brake step."],["Platform","Join the forearms and extend the arms into a flat platform."],["Contact","The ball meets the forearms just above the wrists."],["Redirect","A slight upward and forward swing with the shoulders lifting and the legs pushing sends the ball up."],["Follow-through and reset","The arms follow toward the target, then return to ready."]],"phaseAr":"التلامس بمنصة الساعدين","forceAr":"تعيد المنصة المكونة من الساعدين توجيه الكرة. وتساعد دفعة صغيرة من الرجلين إلى أعلى في التحكم بالزاوية. تؤثر الجاذبية إلى أسفل في الكرة.","stepsAr":[["الاستعداد","وقفة منخفضة والوزن على مقدمتي القدمين والذراعان مرتخيتان."],["التحرك خلف الكرة","تحرك خلف مسار الكرة مع خطوة فرملة."],["تكوين المنصة","اجمع الساعدين ومد الذراعين لتشكيل منصة مسطحة."],["التلامس","تلامس الكرة الساعدين فوق الرسغين مباشرة."],["إعادة التوجيه","ترسل مرجحة بسيطة لأعلى وأمام، مع رفع الكتفين ودفع الرجلين، الكرة إلى أعلى."],["المتابعة والعودة","تتابع الذراعان نحو الهدف ثم تعودان للاستعداد."]],"movesAr":[["ثني الكتف، ومد الرجلين لدفعة صغيرة","سهمي","عرضي من جانب إلى جانب"]],"about":"Receiving a serve or attack with the forearms joined to form a flat platform. The legs and a small arm swing direct the ball to the setter.","aboutAr":"استقبال الإرسال أو الهجمة بالساعدين مضمومين لتكوين سطح مستو. تتحكم الرجلان وحركة صغيرة للذراعين في توجيه الكرة إلى المعد."},{"id":"vb-block","sport":"Volleyball","name":"Volleyball block","ar":"حائط الصد في الكرة الطائرة","aliases":"volleyball net defence blocking","phase":"Jump and arm press","primary":["quads","glutes","calves","delt-f","traps"],"secondary":["chest","triceps","abs","forearms","serratus","lowback"],"moves":[["Vertical jump: hip and knee extension, ankle plantarflexion","Sagittal","Mediolateral (side to side)"],["Arm elevation and press over the net: shoulder flexion/elevation","Sagittal","Mediolateral (side to side)"]],"force":"The legs push down and receive an upward ground reaction. The hands apply force against the incoming ball while it contacts them.","diagram":"up","steps":[["Ready","Close to the net, hands up, knees bent."],["Move","Side step or cross over along the net to the attacker."],["Plant and load","Plant both feet and dip."],["Jump","The arms swing up with the leg drive."],["Press","Arms extend over the net with the hands in front of the ball."],["Landing","Land balanced with the elbows bent."],["Reset","Turn and prepare for the next play."]],"phaseAr":"القفز وضغط الذراعين","forceAr":"تدفع الرجلان إلى أسفل وتحصلان على رد فعل من الأرض إلى أعلى. تضغط اليدان على الكرة القادمة أثناء التلامس.","stepsAr":[["الاستعداد","قرب الشبكة واليدان مرفوعتان والركبتان مثنيتان."],["التحرك","اخط جانبيا أو بخطوة تقاطع بمحاذاة الشبكة نحو المهاجم."],["الارتكاز والتحميل","ثبت القدمين واخفض الجسم."],["القفز","تندفع الذراعان إلى أعلى مع دفع الرجلين."],["الضغط","تمتد الذراعان فوق الشبكة واليدان أمام الكرة."],["الهبوط","اهبط بتوازن مع ثني المرفقين."],["إعادة الاستعداد","استدر واستعد للحركة التالية."]],"movesAr":[["القفز الرأسي: مد الورك والركبة، والثني الأخمصي للكاحل","سهمي","عرضي من جانب إلى جانب"],["رفع الذراع وضغطها فوق الشبكة: ثني الكتف ورفعه","سهمي","عرضي من جانب إلى جانب"]],"about":"A jump at the net with the arms pressed over it to stop or redirect the opponent's attack.","aboutAr":"قفزة عند الشبكة مع دفع الذراعين فوقها لإيقاف هجمة الخصم أو تغيير اتجاهها."},{"id":"tn-forehand","sport":"Tennis","name":"Tennis forehand","ar":"الضربة الأمامية في التنس","aliases":"tennis groundstroke forehand drive","phase":"Unit turn through finish","primary":["glutes","obliques","chest","delt-f"],"secondary":["quads","calves","abs","lats","forearms","rotator","triceps"],"moves":[["Hip and trunk rotation","Transverse","Vertical (longitudinal)"],["Shoulder internal rotation and horizontal adduction","Transverse","Vertical (longitudinal)"],["Elbow, wrist and forearm control","Sagittal and others","Mediolateral (side to side)"]],"force":"The ground pushes through the legs and hips and the racket applies force on the ball forward and slightly up. Speed comes from trunk rotation, upper-arm internal rotation and wrist flexion. The ball applies force back on the racket.","diagram":"upforward","steps":[["Ready","Split step on the balls of the feet, racket in front."],["Unit turn","Shoulders and hips turn; racket moves back."],["Step and load","Weight transfers onto the back leg, then forward."],["Forward swing","Hips, trunk, shoulder and racket accelerate."],["Contact","Strike the ball in front of the body."],["Follow-through","The racket finishes across and up."],["Recovery","Return to a balanced ready position."]],"phaseAr":"من دوران الجسم كوحدة حتى الإنهاء","forceAr":"تنقل الأرض الدفع عبر الرجلين والوركين ويؤثر المضرب في الكرة بقوة إلى الأمام وأعلى قليلا. تأتي السرعة من دوران الجذع والدوران الداخلي للعضد وثني الرسغ. وتؤثر الكرة بقوة معاكسة في المضرب.","stepsAr":[["الاستعداد","نفذ وثبة استعداد صغيرة على مقدمتي القدمين والمضرب أمام الجسم."],["الدوران كوحدة","يدور الكتفان والوركان ويرجع المضرب."],["الخطوة والتحميل","ينتقل الوزن على الرجل الخلفية ثم إلى الأمام."],["المرجحة الأمامية","يتسارع الوركان والجذع والكتف والمضرب."],["الضرب","اضرب الكرة أمام الجسم."],["المتابعة","ينتهي المضرب عبر الجسم وإلى أعلى."],["العودة","عد إلى وضع استعداد متزن."]],"movesAr":[["دوران الورك والجذع","مستعرض","رأسي، طولي"],["الدوران الداخلي والتقريب الأفقي للكتف","مستعرض","رأسي، طولي"],["التحكم في المرفق والرسغ والساعد","سهمي ومستويات أخرى","عرضي من جانب إلى جانب"]],"about":"The basic stroke hit on the dominant-hand side. The body turns, the racket swings forward and the shoulders and hips add power.","aboutAr":"الضربة الأساسية على جهة اليد المسيطرة. يدور الجسم وتتأرجح المضرب للأمام ويضيف الكتفان والوركان القوة."},{"id":"tn-backhand","sport":"Tennis","name":"Tennis two-handed backhand","ar":"الضربة الخلفية بكلتا اليدين","aliases":"tennis groundstroke backhand","phase":"Unit turn through finish","primary":["obliques","glutes","chest","delt-f"],"secondary":["delt-r","lats","quads","calves","abs","forearms","rotator","triceps","biceps"],"moves":[["Hip and trunk rotation","Transverse","Vertical (longitudinal)"],["Shoulder rotation and horizontal movement of both arms","Transverse","Vertical (longitudinal)"]],"force":"The ground pushes through the legs. The non-dominant arm acts like a forehand arm and drives the racket while the dominant arm stabilizes it. The racket applies force forward and slightly up on the ball.","diagram":"upforward","steps":[["Ready","Split step, racket held with both hands."],["Unit turn","Turn the shoulders and hips."],["Load","Weight moves to the back leg."],["Swing","Hips, trunk and both arms accelerate."],["Contact","Strike the ball in front of the body."],["Follow-through","Both arms continue across and up."],["Recovery","Return to ready."]],"phaseAr":"من دوران الجسم كوحدة حتى الإنهاء","forceAr":"تنقل الأرض الدفع عبر الرجلين. تؤدي الذراع غير المهيمنة دور ذراع الضربة الأمامية وتدفع المضرب، بينما تثبته الذراع المهيمنة. يؤثر المضرب في الكرة بقوة إلى الأمام وأعلى قليلا.","stepsAr":[["الاستعداد","وثبة استعداد صغيرة مع إمساك المضرب باليدين."],["الدوران كوحدة","أدر الكتفين والوركين."],["التحميل","ينتقل الوزن إلى الرجل الخلفية."],["المرجحة","يتسارع الوركان والجذع والذراعان."],["الضرب","اضرب الكرة أمام الجسم."],["المتابعة","تستمر الذراعان عبر الجسم وإلى أعلى."],["العودة","عد إلى الاستعداد."]],"movesAr":[["دوران الورك والجذع","مستعرض","رأسي، طولي"],["دوران الكتف والحركة الأفقية للذراعين","مستعرض","رأسي، طولي"]],"about":"A stroke hit on the non-dominant side, here with both hands on the racket. Both arms and the trunk rotation guide the swing.","aboutAr":"ضربة على الجهة غير المسيطرة، هنا بكلتا اليدين على المضرب. تقود الذراعان ودوران الجذع التأرجح."},{"id":"tn-serve","sport":"Tennis","name":"Tennis serve","ar":"إرسال التنس","aliases":"tennis serve overhead","phase":"Trophy through finish","primary":["quads","calves","chest","obliques","abs"],"secondary":["glutes","delt-f","triceps","lats","forearms","rotator","serratus"],"moves":[["Leg drive: hip and knee extension, ankle plantarflexion","Sagittal","Mediolateral (side to side)"],["Trunk rotation and shoulder internal rotation","Transverse","Vertical (longitudinal)"],["Elbow extension and forearm pronation","Sagittal and rotation","Varies"]],"force":"The legs push into the ground and the racket accelerates up and forward to the ball. The ball applies a force back on the racket.","diagram":"upforward","steps":[["Start","Balanced stance behind the baseline, ball and racket together."],["Release (toss)","The ball is released upward above the hitting shoulder."],["Loading","The knees bend and the body lowers."],["Cocking","The elbows rise and the racket drops behind the back, shoulder externally rotated."],["Acceleration","The legs drive upward, the trunk rotates and the shoulder rotates inward."],["Contact","The arm extends and the racket meets the ball at its highest reachable point. Wrist flexion adds speed."],["Deceleration","The racket arm slows as the trunk and shoulder absorb the energy."],["Finish","The racket ends across the body and you land and return to ready."]],"phaseAr":"من وضع الكأس حتى الإنهاء","forceAr":"تضغط الرجلان على الأرض ويتسارع المضرب إلى أعلى وأمام نحو الكرة. وتؤثر الكرة بقوة معاكسة في المضرب.","stepsAr":[["البداية","وقفة متزنة خلف خط القاعدة والكرة والمضرب معا."],["إطلاق الكرة للقذف","تطلق الكرة إلى أعلى فوق كتف الضرب."],["التحميل","تنثني الركبتان وينخفض الجسم."],["المرجحة الخلفية","يرتفع المرفقان وينخفض المضرب خلف الظهر مع دوران الكتف للخارج."],["التسارع","تدفع الرجلان إلى أعلى ويدور الجذع ويدور الكتف للداخل."],["الضرب","تمتد الذراع ويلتقي المضرب بالكرة عند أعلى نقطة يمكن الوصول إليها. يضيف ثني الرسغ سرعة."],["التباطؤ","تتباطأ ذراع المضرب مع امتصاص الجذع والكتف للطاقة."],["الإنهاء","ينتهي المضرب عبر الجسم، ثم تهبط وتعود للاستعداد."]],"movesAr":[["دفع الرجلين: مد الورك والركبة، والثني الأخمصي للكاحل","سهمي","عرضي من جانب إلى جانب"],["دوران الجذع والدوران الداخلي للكتف","مستعرض","رأسي، طولي"],["مد المرفق وكب الساعد","سهمي ودوراني","متغير"]],"about":"The stroke that starts every point. The ball is tossed up and hit overhead with a full-body motion from legs to racket.","aboutAr":"الضربة التي تبدأ كل نقطة. تقذف الكرة لأعلى وتضرب من فوق الرأس بحركة تبدأ من الرجلين وتنتهي بالمضرب."},{"id":"tn-volley","sport":"Tennis","name":"Tennis volley","ar":"الضربة الطائرة في التنس (فولي)","aliases":"tennis net volley فولي","phase":"Short block through recovery","primary":["chest","delt-f","forearms"],"secondary":["triceps","abs","quads","calves","traps","rotator"],"moves":[["Shoulder and elbow control with a short punch","Sagittal and transverse approximation","Mediolateral (side to side)"]],"force":"A small forward push from the body and arm directs the ball; the ball force is absorbed through the racket.","diagram":"forward","steps":[["Ready","Racket in front, knees bent, close to the net."],["Shoulder turn","A small turn without a big backswing."],["Step","Step forward into the ball."],["Block","The racket meets the ball in front."],["Short finish","Follow through a short distance."],["Recover","Return to the ready position."]],"phaseAr":"من صد قصير حتى العودة","forceAr":"توجه دفعة صغيرة إلى الأمام من الجسم والذراع الكرة، وتمتص قوة الكرة عبر المضرب.","stepsAr":[["الاستعداد","المضرب أمام الجسم والركبتان مثنيتان قرب الشبكة."],["دوران الكتفين","دوران صغير دون مرجحة خلفية كبيرة."],["الخطوة","اخط إلى الأمام باتجاه الكرة."],["الصد","يلتقي المضرب بالكرة أمام الجسم."],["إنهاء قصير","تابع الحركة لمسافة قصيرة."],["العودة","عد إلى وضع الاستعداد."]],"movesAr":[["التحكم في الكتف والمرفق بدفعة قصيرة","تقريب للمستويين السهمي والمستعرض","عرضي من جانب إلى جانب"]],"about":"A short punch-like hit before the ball bounces, usually near the net. The racket moves very little.","aboutAr":"ضربة قصيرة تشبه الدفع قبل أن ترتد الكرة، وغالبا قرب الشبكة. تتحرك المضرب حركة صغيرة جدا."},{"id":"ka-gyaku-zuki","sport":"Karate","name":"Karate reverse punch (gyaku-zuki)","ar":"جياكو زوكي (اللكمة العكسية)","aliases":"karate punch reverse punch zuki","phase":"Rear-hand punch from stance","primary":["triceps","chest","delt-f","obliques","glutes"],"secondary":["quads","calves","serratus","abs","forearms","rotator"],"moves":[["Hip rotation and trunk rotation","Transverse","Vertical (longitudinal)"],["Elbow extension; shoulder horizontal adduction and flexion","Sagittal and transverse approximation","Mediolateral (side to side) and vertical"]],"force":"The rear leg drives into the floor, the hips rotate and the fist applies force forward on the target. The target reacts back on the fist.","diagram":"forward","steps":[["Ready stance","Stable stance, guard up."],["Hips rotate","The hips turn from half-facing to square and the shoulders follow the hips."],["Punch","The fist goes straight to the target while the other hand withdraws to the hip (hikite). The fist rotates palm-down late."],["Kime","Focus at contact with the torso braced."],["Guard","Return the fist and take guard immediately."]],"phaseAr":"لكمة باليد الخلفية من الوقفة","forceAr":"تدفع الرجل الخلفية الأرض ويدور الوركان وتؤثر القبضة بقوة أمامية في الهدف. ويرد الهدف بقوة معاكسة على القبضة.","stepsAr":[["وقفة الاستعداد","وقفة ثابتة مع رفع الحراسة."],["دوران الوركين","يدور الوركان من وضع المواجهة الجزئية إلى المواجهة الكاملة، ويتبعهما الكتفان."],["اللكم","تتجه القبضة مباشرة إلى الهدف وتسحب اليد الأخرى إلى الورك، أي الهيكيتي. تدور القبضة لتتجه راحة اليد إلى أسفل في نهاية الحركة."],["الكيمي","ركز الحركة عند التلامس مع تثبيت الجذع."],["الحراسة","أعد القبضة واتخذ الحراسة فورا."]],"movesAr":[["دوران الورك ودوران الجذع","مستعرض","رأسي، طولي"],["مد المرفق، والتقريب الأفقي للكتف وثنيه","تقريب للمستويين السهمي والمستعرض","عرضي ورأسي"]],"about":"The reverse punch with the rear hand. The hips rotate strongly to drive the fist straight at the target.","aboutAr":"اللكمة العكسية باليد الخلفية. يدور الوركان بقوة لدفع القبضة مستقيمة نحو الهدف."},{"id":"ka-mae-geri","sport":"Karate","name":"Karate front kick (mae-geri)","ar":"ماي جيري (الركلة الأمامية)","aliases":"karate front kick geri","phase":"Knee lift through kick and retraction","primary":["hipflex","quads","abs","glutes"],"secondary":["calves","adductors","obliques","hams","lowback"],"moves":[["Hip flexion, knee extension, ankle control","Sagittal","Mediolateral (side to side)"]],"force":"The support leg pushes into the floor and the kicking foot applies force forward and slightly up on the target.","diagram":"forward","steps":[["Ready stance","Balanced, guard up."],["Chamber","Lift the knee high with the heel tucked."],["Kick","The leg springs out and the ball of the foot strikes the target."],["Retract","Pull the leg back quickly along the same path (retraction is emphasized)."],["Return","Place the foot down and return to the ready stance."]],"phaseAr":"من رفع الركبة حتى الركل والسحب","forceAr":"تضغط رجل الارتكاز على الأرض وتؤثر القدم الراكلة بقوة أمامية وإلى أعلى قليلا في الهدف.","stepsAr":[["وقفة الاستعداد","توازن مع رفع الحراسة."],["التجهيز","ارفع الركبة عاليا مع ضم الكعب."],["الركل","تنطلق الرجل للخارج وتضرب مقدمة باطن القدم الهدف."],["السحب","اسحب الرجل بسرعة في المسار نفسه، مع التأكيد على السحب."],["العودة","ضع القدم على الأرض وعد إلى وقفة الاستعداد."]],"movesAr":[["ثني الورك ومد الركبة والتحكم في الكاحل","سهمي","عرضي من جانب إلى جانب"]],"about":"The front kick. The knee lifts, then the leg snaps straight and pulls back quickly.","aboutAr":"الركلة الأمامية. ترتفع الركبة ثم تمتد الرجل بسرعة وتعود بسرعة."},{"id":"ka-mawashi-geri","sport":"Karate","name":"Karate roundhouse kick (mawashi-geri)","ar":"ماواشي جيري (الركلة الدائرية)","aliases":"karate roundhouse kick geri","phase":"Pivot through kick and retraction","primary":["hipflex","glutes","obliques","quads"],"secondary":["adductors","calves","abs","hams","lowback","glute-deep"],"moves":[["Hip flexion, abduction and axial pelvic rotation, knee extension","Transverse, sagittal and coronal elements","Vertical (longitudinal) and mediolateral"]],"force":"The support foot pivots on the floor and the kicking foot sweeps through an arc to the target. The target reacts back on the foot.","diagram":"arc","steps":[["Ready stance","Balanced, guard up."],["Preparation","Pivot the support foot and turn the hips."],["Chamber","Lift the knee to the side and front."],["Extension","Extend the knee to strike with the instep or ball of the foot."],["Recoil","Bend the knee again and bring the foot back."],["Return","Place the foot down and return to the ready stance."]],"phaseAr":"من دوران الارتكاز حتى الركل والسحب","forceAr":"تدور قدم الارتكاز على الأرض وتتحرك القدم الراكلة في قوس نحو الهدف. ويرد الهدف بقوة معاكسة على القدم.","stepsAr":[["وقفة الاستعداد","توازن مع رفع الحراسة."],["التحضير","در على قدم الارتكاز وأدر الوركين."],["التجهيز","ارفع الركبة إلى الجانب والأمام."],["المد","مد الركبة للضرب بوجه القدم أو مقدمة باطنها."],["السحب","اثن الركبة مرة أخرى وأعد القدم."],["العودة","ضع القدم على الأرض وعد إلى وقفة الاستعداد."]],"movesAr":[["ثني الورك وتبعيده والدوران المحوري للحوض ومد الركبة","عناصر مستعرضة وسهمية وإكليلية","رأسي طولي وعرضي"]],"about":"The roundhouse kick. You pivot on the standing foot and swing the leg in an arc to hit with the top of the foot or shin.","aboutAr":"الركلة الدائرية. تدور على القدم الثابتة وتحرك الرجل في قوس لتضرب بوجه القدم أو الساق."},{"id":"ka-age-uke","sport":"Karate","name":"Karate rising block (age-uke)","ar":"أجي أوكي (الصد الصاعد)","aliases":"karate block uke rising block","phase":"Block rise from chamber","primary":["delt-f","biceps","traps","obliques"],"secondary":["triceps","forearms","chest","abs","glutes","quads"],"moves":[["Shoulder flexion and elbow flexion","Sagittal","Mediolateral (side to side)"],["Trunk rotation","Transverse","Vertical (longitudinal)"]],"force":"The forearm pushes up and out against an incoming strike; the opponent applies force down on the forearm.","diagram":"up","steps":[["Ready stance","Stable stance, hands in guard."],["Chamber","One fist is at the hip (hikite) and the blocking arm crosses the body."],["Rise","The forearm sweeps diagonally up from the opposite hip in front of the face."],["Block","The forearm deflects the strike rather than stopping it. The torso stays braced."],["Return","Lower the arm and return to the ready stance."]],"phaseAr":"رفع الصد من وضع التجهيز","forceAr":"يدفع الساعد إلى أعلى وخارجا ضد الضربة القادمة، ويؤثر الخصم بقوة إلى أسفل في الساعد.","stepsAr":[["وقفة الاستعداد","وقفة ثابتة واليدان في الحراسة."],["التجهيز","إحدى القبضتين عند الورك في وضع الهيكيتي، وتعبر ذراع الصد أمام الجسم."],["الرفع","يتحرك الساعد قطريا إلى أعلى من الورك المقابل وأمام الوجه."],["الصد","يحرف الساعد الضربة بدلا من إيقافها، مع بقاء الجذع ثابتا."],["العودة","اخفض الذراع وعد إلى وقفة الاستعداد."]],"movesAr":[["ثني الكتف وثني المرفق","سهمي","عرضي من جانب إلى جانب"],["دوران الجذع","مستعرض","رأسي، طولي"]],"about":"The rising block. The forearm lifts upward to deflect a high attack away from the head.","aboutAr":"الصد الصاعد. يرتفع الساعد لأعلى لإبعاد هجمة عالية عن الرأس."},{"id":"sc-pass","sport":"Soccer (football)","name":"Soccer inside-foot pass","ar":"تمريرة كرة القدم بباطن القدم","aliases":"football soccer short pass side foot","phase":"Plant through follow-through","primary":["adductors","quads","glutes","hipflex"],"secondary":["calves","abs","obliques","glute-deep","hams"],"moves":[["Hip rotation and knee extension","Transverse and sagittal","Vertical (longitudinal) and mediolateral"]],"force":"The support foot pushes into the ground; the kicking foot pushes the ball forward and the ball pushes back on the foot.","diagram":"forward","steps":[["Ready","Look up, balanced, approach the ball."],["Plant","Support foot beside the ball, pointing at the target."],["Swing","The kicking leg draws back and swings through."],["Contact","Inside of the foot contacts the middle of the ball."],["Follow-through","The kicking leg continues toward the target."],["Reset","Place the foot down and move into position."]],"phaseAr":"من الارتكاز حتى المتابعة","forceAr":"تضغط قدم الارتكاز على الأرض، وتدفع القدم الراكلة الكرة إلى الأمام وتؤثر الكرة بقوة معاكسة في القدم.","stepsAr":[["الاستعداد","ارفع نظرك وحافظ على التوازن واقترب من الكرة."],["الارتكاز","قدم الارتكاز بجانب الكرة وموجهة نحو الهدف."],["المرجحة","ترجع الرجل الراكلة ثم تتأرجح إلى الأمام."],["التلامس","يلامس باطن القدم منتصف الكرة."],["المتابعة","تستمر الرجل الراكلة نحو الهدف."],["إعادة الاستعداد","ضع القدم على الأرض وتحرك إلى موضعك."]],"movesAr":[["دوران الورك ومد الركبة","مستعرض وسهمي","رأسي طولي وعرضي"]],"about":"The most accurate short pass, struck with the inside of the foot. The planted foot points at the target.","aboutAr":"أدق تمريرة قصيرة، تضرب بباطن القدم. تشير القدم الثابتة إلى الهدف."},{"id":"sc-shot","sport":"Soccer (football)","name":"Soccer instep shot","ar":"تسديدة كرة القدم بوجه القدم","aliases":"football soccer kick shoot drive instep","phase":"Approach through follow-through","primary":["hipflex","quads","glutes","abs"],"secondary":["hams","adductors","obliques","calves","lowback"],"moves":[["Hip flexion and knee extension","Sagittal","Mediolateral (side to side)"],["Pelvis rotation","Transverse","Vertical (longitudinal)"]],"force":"The plant foot pushes into the ground. The shoe laces strike the ball forward and slightly up.","diagram":"upforward","steps":[["Ready","Look at the ball and goal; short approach."],["Plant","Support foot beside and slightly behind the ball."],["Backswing","The hip extends and the knee flexes."],["Cocking","The thigh moves forward and the knee stays bent behind it."],["Acceleration and contact","Hip then knee then ankle accelerate like a whip; the laces strike the ball with the ankle locked."],["Follow-through","The leg continues toward the target."],["Recover","Land on the kicking foot and move on."]],"phaseAr":"من الاقتراب حتى المتابعة","forceAr":"تضغط قدم الارتكاز على الأرض. ويضرب وجه الحذاء عند الرباط الكرة إلى الأمام وأعلى قليلا.","stepsAr":[["الاستعداد","انظر إلى الكرة والمرمى مع اقتراب قصير."],["الارتكاز","قدم الارتكاز بجانب الكرة وخلفها قليلا."],["المرجحة الخلفية","يمتد الورك وتنثني الركبة."],["التجهيز","يتحرك الفخذ أماما وتبقى الركبة مثنية خلفه."],["التسارع والتلامس","يتسارع الورك ثم الركبة ثم الكاحل كالسوط، ويضرب وجه الحذاء الكرة مع تثبيت الكاحل."],["المتابعة","تستمر الرجل نحو الهدف."],["العودة","اهبط على القدم الراكلة وتابع الحركة."]],"movesAr":[["ثني الورك ومد الركبة","سهمي","عرضي من جانب إلى جانب"],["دوران الحوض","مستعرض","رأسي، طولي"]],"about":"A powerful shot struck with the laces (top of the foot). The leg swings through the ball from the hip and knee.","aboutAr":"تسديدة قوية بوجه القدم (الجزء العلوي منها). تتأرجح الرجل عبر الكرة من الورك والركبة."},{"id":"sc-header","sport":"Soccer (football)","name":"Soccer header","ar":"ضربة الرأس في كرة القدم","aliases":"football soccer heading head ball","phase":"Arch through contact","primary":["abs","hipflex","quads","traps"],"secondary":["lowback","glutes","calves","obliques","hams"],"moves":[["Trunk extension then flexion","Sagittal","Mediolateral (side to side)"],["Neck stabilisation","Sagittal","Mediolateral (side to side)"]],"force":"The trunk swings forward and the forehead meets the ball; the ball pushes back on the head.","diagram":"forward","steps":[["Ready","Eyes on the ball, knees bent."],["Jump or step","Move into position."],["Arch back","The trunk extends back and the chin is tucked."],["Swing","The trunk flexes forward."],["Contact","The forehead near the hairline strikes the ball."],["Landing","Land with bent knees."],["Reset","Return to a balanced stance."]],"phaseAr":"من التقوس حتى التلامس","forceAr":"يتأرجح الجذع أماما وتلتقي الجبهة بالكرة التي تدفع الرأس في الاتجاه المعاكس.","stepsAr":[["الاستعداد","العينان على الكرة والركبتان مثنيتان."],["القفز أو الخطوة","تحرك إلى الموضع المناسب."],["التقوس للخلف","يمتد الجذع خلفا مع ضم الذقن."],["المرجحة","ينثني الجذع إلى الأمام."],["التلامس","تضرب الجبهة قرب خط الشعر الكرة."],["الهبوط","اهبط بركبتين مثنيتين."],["إعادة الاستعداد","عد إلى وقفة متزنة."]],"movesAr":[["مد الجذع ثم ثنيه","سهمي","عرضي من جانب إلى جانب"],["تثبيت الرقبة","سهمي","عرضي من جانب إلى جانب"]],"about":"Hitting the ball with the forehead. The body arches back and then drives forward through the neck and trunk.","aboutAr":"ضرب الكرة بالجبهة. ينحني الجسم للخلف ثم يندفع للأمام بقوة الرقبة والجذع."},{"id":"sc-throw-in","sport":"Soccer (football)","name":"Soccer throw-in","ar":"رمية التماس","aliases":"football soccer throw in overhead","phase":"Wind-up through release","primary":["triceps","chest","delt-f","abs"],"secondary":["lats","traps","forearms","quads","glutes","lowback","serratus"],"moves":[["Trunk extension then flexion; shoulder flexion; elbow extension","Sagittal","Mediolateral (side to side)"]],"force":"The throwing arms push the ball upward and forward; the ground pushes the body through the legs and trunk.","diagram":"upforward","steps":[["Ready","Face the field with the ball in both hands and part of each foot on the touchline or on the ground outside it."],["Back swing","The ball goes behind the head and the trunk arches back."],["Forward swing","The trunk and arms accelerate forward."],["Release","Throw with both hands from behind and over the head, releasing the ball as it passes over the head, from where it left the field."],["Follow-through","Arms finish toward the target."],["Reset","Return to a balanced stance."]],"phaseAr":"من المرجحة التحضيرية حتى الإطلاق","forceAr":"تدفع الذراعان الكرة إلى أعلى وأمام، وتدفع الأرض الجسم عبر الرجلين والجذع.","stepsAr":[["الاستعداد","واجه الملعب والكرة باليدين، مع وجود جزء من كل قدم على خط التماس أو على الأرض خارجه."],["المرجحة الخلفية","ترجع الكرة خلف الرأس ويتقوس الجذع إلى الخلف."],["المرجحة الأمامية","يتسارع الجذع والذراعان إلى الأمام."],["الإطلاق","ارم باليدين من خلف الرأس ومن فوقه، وأطلق الكرة أثناء مرورها فوق الرأس، من موضع خروجها من الملعب."],["المتابعة","تنتهي الذراعان نحو الهدف."],["إعادة الاستعداد","عد إلى وقفة متزنة."]],"movesAr":[["مد الجذع ثم ثنيه، وثني الكتف ومد المرفق","سهمي","عرضي من جانب إلى جانب"]],"about":"Restarting play from the sideline with both hands. The ball goes back behind the head, then is thrown forward as the body arches.","aboutAr":"استئناف اللعب من خط التماس باليدين. تذهب الكرة خلف الرأس ثم ترمى للأمام مع انحناء الجسم."},{"id":"sw-freestyle","sport":"Swimming","name":"Freestyle (front crawl)","ar":"السباحة الحرة","aliases":"swimming crawl freestyle stroke","phase":"One arm-and-kick cycle","primary":["lats","chest","triceps","delt-f"],"secondary":["obliques","abs","glutes","quads","hams","calves","traps","rotator","forearms"],"moves":[["Pull and push through water: shoulder extension and adduction, elbow movement","Sagittal with body roll","Mediolateral (side to side)"],["Body roll","Transverse and coronal","Vertical (longitudinal) and anteroposterior"],["Flutter kick: hip flexion and extension","Sagittal","Mediolateral (side to side)"]],"force":"The hands and feet push water backward; the water pushes the swimmer forward. Water also provides drag against the body.","diagram":"forward","steps":[["Streamline","Float face down with arms extended and legs together."],["Entry and reach","One hand enters in front of the shoulder and reaches forward as the body rolls."],["Catch","The hand and forearm press down and back with a high elbow."],["Pull and push","The arm pulls under the body and pushes back to the thigh."],["Breathe","On a breathing stroke the head turns with the body roll, in the late pull and early recovery, rather than lifting."],["Recovery","The elbow lifts and the relaxed arm swings forward over the water while the other arm pulls."],["Repeat and glide","Alternate sides with a continuous flutter kick, then return to a streamlined glide at the end."]],"phaseAr":"دورة واحدة للذراعين والرجلين","forceAr":"تدفع اليدان والقدمان الماء إلى الخلف، ويدفع الماء السباح إلى الأمام. ويولد الماء أيضا مقاومة على الجسم.","stepsAr":[["الوضع الانسيابي","اطف ووجهك لأسفل والذراعان ممدودتان والرجلان مضمومتان."],["الدخول والمد","تدخل إحدى اليدين أمام الكتف وتمتد إلى الأمام مع التفاف الجسم."],["مسك الماء","تضغط اليد والساعد إلى أسفل وخلفا مع إبقاء المرفق عاليا."],["السحب والدفع","تسحب الذراع تحت الجسم ثم تدفع إلى الخلف حتى الفخذ."],["التنفس","في دورة التنفس يدور الرأس مع التفاف الجسم خلال نهاية السحب وبداية الرجوع، بدلا من رفعه."],["الرجوع","يرتفع المرفق وتتأرجح الذراع المرتخية أماما فوق الماء بينما تسحب الذراع الأخرى."],["التكرار والانزلاق","بادل الجانبين مع ضربات رجلين تبادلية مستمرة، ثم عد إلى انزلاق انسيابي في النهاية."]],"movesAr":[["السحب والدفع خلال الماء: مد الكتف وتقريبه وحركة المرفق","سهمي مع التفاف الجسم","عرضي من جانب إلى جانب"],["التفاف الجسم","مستعرض وإكليلي","رأسي طولي وأمامي خلفي"],["ضربات الرجلين التبادلية: ثني الورك ومده","سهمي","عرضي من جانب إلى جانب"]],"about":"Also called front crawl, the fastest stroke. Arms pull in turn, the legs kick steadily and the swimmer rotates side to side.","aboutAr":"تسمى أيضا الزحف على البطن، وهي أسرع الأساليب. تسحب الذراعان بالتناوب وتركل الرجلان بثبات ويدور السباح من جانب إلى آخر."},{"id":"sw-backstroke","sport":"Swimming","name":"Backstroke","ar":"سباحة الظهر","aliases":"swimming backstroke back crawl","phase":"One arm-and-kick cycle","primary":["lats","delt-f","triceps","chest"],"secondary":["abs","obliques","lowback","glutes","quads","hams","forearms","rotator","biceps"],"moves":[["Arm pull and push: shoulder extension and internal rotation","Sagittal and coronal","Mediolateral (side to side)"],["Body roll","Transverse and coronal","Vertical (longitudinal)"],["Flutter kick","Sagittal","Mediolateral (side to side)"]],"force":"The hands and feet push water; the water pushes the swimmer back-first. Water provides drag.","diagram":"forward","steps":[["Streamline","Float face up with arms overhead and legs together."],["Entry","One straight arm enters above the shoulder, little finger first."],["Catch and pull","The body rolls toward the pulling arm. The elbow bends and the hand presses down and back."],["Push","The arm extends toward the thigh."],["Recovery","The straight arm lifts out and arcs overhead while the other arm pulls. The face stays up."],["Kick and roll","The legs flutter kick continuously, about three kicks per arm stroke, with the body rolling side to side."],["Repeat and glide","Alternate arms, then return to a streamlined float."]],"phaseAr":"دورة واحدة للذراعين والرجلين","forceAr":"تدفع اليدان والقدمان الماء، فيدفع الماء السباح مع توجيه الظهر إلى الماء. ويوفر الماء مقاومة للحركة.","stepsAr":[["الوضع الانسيابي","اطف ووجهك لأعلى والذراعان فوق الرأس والرجلان مضمومتان."],["الدخول","تدخل ذراع مستقيمة فوق الكتف ويبدأ الخنصر الدخول أولا."],["مسك الماء والسحب","يلتف الجسم نحو الذراع الساحبة. ينثني المرفق وتضغط اليد إلى أسفل وخلفا."],["الدفع","تمتد الذراع نحو الفخذ."],["الرجوع","ترتفع الذراع المستقيمة خارج الماء في قوس فوق الرأس بينما تسحب الذراع الأخرى. يبقى الوجه لأعلى."],["ضربات الرجلين والالتفاف","تؤدي الرجلان ضربات تبادلية مستمرة، نحو ثلاث ضربات لكل حركة ذراع، مع التفاف الجسم من جانب لآخر."],["التكرار والانزلاق","بادل الذراعين ثم عد إلى الطفو الانسيابي."]],"movesAr":[["سحب الذراع ودفعها: مد الكتف ودورانه للداخل","سهمي وإكليلي","عرضي من جانب إلى جانب"],["التفاف الجسم","مستعرض وإكليلي","رأسي، طولي"],["ضربات الرجلين التبادلية","سهمي","عرضي من جانب إلى جانب"]],"about":"Swimming on the back with alternating arm pulls and a steady kick. The face stays out of the water.","aboutAr":"السباحة على الظهر مع سحب الذراعين بالتناوب وركل ثابت. يبقى الوجه خارج الماء."},{"id":"sw-breaststroke","sport":"Swimming","name":"Breaststroke","ar":"سباحة الصدر","aliases":"swimming breaststroke frog kick","phase":"One pull-and-kick cycle","primary":["chest","lats","adductors","quads"],"secondary":["delt-f","triceps","glutes","hams","calves","abs","forearms"],"moves":[["Arm sweep: shoulder horizontal adduction","Transverse","Vertical (longitudinal)"],["Frog kick: hip and knee extension then leg adduction","Sagittal and coronal","Mediolateral (side to side) and anteroposterior"]],"force":"The hands and feet push water backward and the water pushes the swimmer forward. The legs provide most of the propulsion. Drag rises when the head lifts and the knees bend.","diagram":"forward","steps":[["Streamline","Float face down with arms forward and legs together."],["Outsweep","The hands sweep outward and slightly down."],["Insweep and breathe","The hands sweep in toward the chin, the chest rises and the head lifts to breathe. The heels start to draw up near the end."],["Recovery and kick","The arms shoot forward while the kick happens: heels up, feet turned out, a sweep outward and back, then the legs squeeze together."],["Glide","Hold a streamlined glide before the next outsweep."]],"phaseAr":"دورة واحدة للسحب والركل","forceAr":"تدفع اليدان والقدمان الماء إلى الخلف ويدفع الماء السباح إلى الأمام. توفر الرجلان معظم الدفع. وتزداد المقاومة عند رفع الرأس وثني الركبتين.","stepsAr":[["الوضع الانسيابي","اطف ووجهك لأسفل والذراعان أمام الجسم والرجلان مضمومتان."],["المسح للخارج","تتحرك اليدان للخارج وإلى أسفل قليلا."],["المسح للداخل والتنفس","تتحرك اليدان نحو الذقن ويرتفع الصدر والرأس للتنفس. ويبدأ سحب الكعبين قرب نهاية المرحلة."],["الرجوع والركل","تندفع الذراعان أماما أثناء الركلة: يرتفع الكعبان وتتجه القدمان للخارج، ثم تمسحان للخارج والخلف وتضم الرجلان معا."],["الانزلاق","حافظ على انزلاق انسيابي قبل المسح التالي للخارج."]],"movesAr":[["مسح الذراع: التقريب الأفقي للكتف","مستعرض","رأسي، طولي"],["ركلة الضفدع: مد الورك والركبة ثم تقريب الرجلين","سهمي وإكليلي","عرضي وأمامي خلفي"]],"about":"A stroke where the arms sweep out and in together and the legs do a frog kick. The body rises and glides in each cycle.","aboutAr":"أسلوب تتحرك فيه الذراعان معا للخارج والداخل وتؤدي الرجلان ركلة الضفدع. يرتفع الجسم وينزلق في كل دورة."},{"id":"sw-butterfly","sport":"Swimming","name":"Butterfly","ar":"سباحة الفراشة","aliases":"swimming butterfly fly dolphin kick","phase":"One arm-and-kick cycle","primary":["lats","chest","delt-f","triceps"],"secondary":["abs","lowback","glutes","quads","hams","calves","traps","forearms"],"moves":[["Both arms pull: shoulder extension and adduction","Sagittal","Mediolateral (side to side)"],["Body undulation: spine flexion and extension","Sagittal","Mediolateral (side to side)"],["Dolphin kick: hip flexion and extension","Sagittal","Mediolateral (side to side)"]],"force":"Both arms and the legs push water backward and the water pushes the swimmer forward. The down-kicks add thrust twice per cycle. Drag rises when the head lifts for the breath.","diagram":"forward","steps":[["Streamline","Push off face down, arms forward, legs together."],["Entry and first kick","Both hands enter about shoulder width or a little wider as the first, larger down-kick drives the hips up."],["Catch","Elbows stay high and the hands and forearms press outward and down."],["Pull","The hands sweep in toward the midline under the chest."],["Push and breathe","The hands push back past the hips. At the end of the push the head lifts forward to breathe, chin near the surface."],["Second kick and exit","A second down-kick happens as the hands leave the water at the hips."],["Recovery","Both arms swing low and wide over the water. The head goes back down before the hands re-enter."],["Repeat and finish","Two kicks per arm cycle. Glide streamlined only at a wall or at the finish."]],"phaseAr":"دورة واحدة للذراعين والرجلين","forceAr":"تدفع الذراعان والرجلان الماء إلى الخلف ويدفع الماء السباح إلى الأمام. تضيف ضربتا الرجلين لأسفل دفعا مرتين في كل دورة. وتزداد المقاومة عند رفع الرأس للتنفس.","stepsAr":[["الوضع الانسيابي","ادفع من الحائط ووجهك لأسفل والذراعان أماما والرجلان مضمومتان."],["الدخول والضربة الأولى","تدخل اليدان بعرض الكتفين تقريبا أو أوسع قليلا، مع الضربة الأولى الأكبر إلى أسفل التي ترفع الوركين."],["مسك الماء","يبقى المرفقان عاليين وتضغط اليدان والساعدان للخارج وأسفل."],["السحب","تتحرك اليدان إلى الداخل نحو خط المنتصف تحت الصدر."],["الدفع والتنفس","تدفع اليدان للخلف بعد الوركين. وفي نهاية الدفع يرتفع الرأس أماما للتنفس والذقن قرب السطح."],["الضربة الثانية والخروج","تحدث ضربة ثانية لأسفل عند خروج اليدين من الماء بجانب الوركين."],["الرجوع","تتأرجح الذراعان بشكل منخفض وواسع فوق الماء. ويعود الرأس لأسفل قبل دخول اليدين من جديد."],["التكرار والإنهاء","ضربتان للرجلين في كل دورة ذراعين. يكون الانزلاق الانسيابي فقط عند الحائط أو النهاية."]],"movesAr":[["سحب الذراعين: مد الكتف وتقريبه","سهمي","عرضي من جانب إلى جانب"],["تموج الجسم: ثني العمود الفقري ومده","سهمي","عرضي من جانب إلى جانب"],["ركلة الدولفين: ثني الورك ومده","سهمي","عرضي من جانب إلى جانب"]],"about":"Both arms pull together and sweep over the water, with a wave-like body motion and a dolphin kick.","aboutAr":"تسحب الذراعان معا وتمران فوق الماء مع حركة جسم موجية وركلة الدولفين."},{"id":"tf-sprint-start","sport":"Track and field","name":"Sprint start","ar":"انطلاق العدو السريع","aliases":"track and field sprint start block 100m","phase":"Set position through first strides","primary":["glutes","quads","hams","calves"],"secondary":["hipflex","abs","lowback","delt-f","triceps"],"moves":[["Hip, knee and ankle extension","Sagittal","Mediolateral (side to side)"]],"force":"The feet push backward and downward against the blocks or ground and the ground pushes the body forward and upward.","diagram":"forward","steps":[["On your marks","Hands behind the line, feet on blocks, body still."],["Set","Hips rise and weight shifts toward the hands."],["Drive","Both legs push forward from the blocks."],["First steps","Low body angle, quick strides, arms swinging."],["Rise","The torso gradually rises."],["Sprint","Reach upright running form."],["Finish and slow","Continue past the finish line and slow down."]],"phaseAr":"من وضع الاستعداد حتى الخطوات الأولى","forceAr":"تضغط القدمان إلى الخلف وأسفل على مكعبات البدء أو الأرض، فتدفع الأرض الجسم إلى الأمام وأعلى.","stepsAr":[["خذ مكانك","اليدان خلف الخط والقدمان على المكعبات والجسم ثابت."],["استعد","يرتفع الوركان وينتقل الوزن نحو اليدين."],["الدفع","تدفع الرجلان الجسم أماما من المكعبات."],["الخطوات الأولى","زاوية الجسم منخفضة والخطوات سريعة والذراعان تتأرجحان."],["الارتفاع","يرتفع الجذع تدريجيا."],["العدو","صل إلى وضع الجري المنتصب."],["النهاية والتهدئة","استمر بعد خط النهاية ثم خفف السرعة."]],"movesAr":[["مد الورك والركبة والكاحل","سهمي","عرضي من جانب إلى جانب"]],"about":"The explosive start of a sprint from the blocks. You push hard against them and drive out low over the first steps.","aboutAr":"الانطلاقة القوية في العدو من حجري البداية. تدفع الحجرين بقوة وتندفع منخفضا في الخطوات الأولى."},{"id":"tf-long-jump","sport":"Track and field","name":"Long jump","ar":"الوثب الطويل","aliases":"track and field jump long jump horizontal jumps","phase":"Approach through landing","primary":["glutes","quads","hams","calves","hipflex"],"secondary":["abs","lowback","delt-f","traps","obliques"],"moves":[["Take-off: hip, knee and ankle extension","Sagittal","Mediolateral (side to side)"],["Arm and knee drive","Sagittal","Mediolateral (side to side)"]],"force":"The take-off foot pushes down and backward and the ground pushes up and forward. After take-off gravity acts downward on the jumper.","diagram":"upforward","steps":[["Start position","Stand at the start mark."],["Approach","Accelerate along the runway."],["Penultimate stride","The longer of the last two strides, lowering the centre of mass."],["Last stride","Shorter and flatter as the body starts to rise, with the foot landing at or behind the take-off board."],["Take-off","Plant and drive upward with the arms and free knee."],["Flight","Hold the body position."],["Landing","Extend the legs forward and land in the pit."],["Exit","Move forward out of the pit."]],"phaseAr":"من الاقتراب حتى الهبوط","forceAr":"تضغط قدم الارتقاء إلى أسفل وخلفا وتدفع الأرض إلى أعلى وأمام. بعد الارتقاء تؤثر الجاذبية في الواثب إلى أسفل.","stepsAr":[["وضع البداية","قف عند علامة البداية."],["الاقتراب","تسارع على ممر الاقتراب."],["الخطوة قبل الأخيرة","هي الأطول من الخطوتين الأخيرتين وتخفض مركز الكتلة."],["الخطوة الأخيرة","أقصر وأكثر تسطحا مع بدء ارتفاع الجسم، وتهبط القدم على لوحة الارتقاء أو خلفها."],["الارتقاء","ثبت القدم وادفع إلى أعلى بمساعدة الذراعين والركبة الحرة."],["الطيران","حافظ على وضع الجسم."],["الهبوط","مد الرجلين أماما واهبط في الحفرة."],["الخروج","تحرك أماما للخروج من الحفرة."]],"movesAr":[["الارتقاء: مد الورك والركبة والكاحل","سهمي","عرضي من جانب إلى جانب"],["دفع الذراع والركبة","سهمي","عرضي من جانب إلى جانب"]],"about":"A run-up, take-off from the board and a jump for distance. The goal is to leave the ground fast and land as far as possible.","aboutAr":"اقتراب بالجري ثم دفع من لوحة الانطلاق وقفز لأبعد مسافة. الهدف مغادرة الأرض بسرعة والهبوط بعيدا."},{"id":"tf-javelin","sport":"Track and field","name":"Javelin throw","ar":"رمي الرمح","aliases":"track and field javelin throw","phase":"Approach through recovery","primary":["quads","glutes","obliques","chest","delt-f","triceps"],"secondary":["abs","lats","hams","calves","forearms","rotator","serratus"],"moves":[["Block leg extension and trunk rotation","Sagittal and transverse","Mediolateral (side to side) and vertical"],["Shoulder, elbow extension","Sagittal","Mediolateral (side to side)"]],"force":"The ground pushes through the block leg and trunk. The javelin leaves the hand upward and forward; air and gravity then act on it.","diagram":"upforward","steps":[["Start","Hold the javelin by the cord grip above the shoulder."],["Approach","Run with the javelin held steady. The athlete must not turn the back fully to the throwing arc."],["Withdrawal","Draw the javelin back with the shoulders turned."],["Impulse stride","A lengthened, flat last stride puts the body in the release position."],["Block and throw","The front foot plants. The impulse passes from the hip to the trunk to the arm to the javelin, and the javelin is released over the shoulder."],["Recovery","Use a reverse step to stay behind the line."]],"phaseAr":"من الاقتراب حتى استعادة التوازن","forceAr":"تدفع الأرض عبر رجل الإيقاف والجذع. يغادر الرمح اليد إلى أعلى وأمام، ثم يؤثر فيه الهواء والجاذبية.","stepsAr":[["البداية","أمسك الرمح من القبضة الملفوفة بالحبل فوق الكتف."],["الاقتراب","اجر مع تثبيت الرمح. يجب ألا يدير اللاعب ظهره بالكامل لقوس الرمي."],["سحب الرمح","اسحب الرمح إلى الخلف مع دوران الكتفين."],["خطوة الدفع","تضع خطوة أخيرة طويلة ومسطحة الجسم في وضع الإطلاق."],["الإيقاف والرمي","ترتكز القدم الأمامية. تنتقل الدفعة من الورك إلى الجذع فالذراع فالرمح، ويطلق الرمح من فوق الكتف."],["استعادة التوازن","استخدم خطوة تبديل للبقاء خلف الخط."]],"movesAr":[["مد رجل الإيقاف ودوران الجذع","سهمي ومستعرض","عرضي ورأسي"],["مد الكتف والمرفق","سهمي","عرضي من جانب إلى جانب"]],"about":"A long throw of a spear-shaped implement after a run-up. Power travels from the legs through the trunk to the throwing arm.","aboutAr":"رمي طويل لأداة تشبه الرمح بعد الاقتراب. تنتقل القوة من الرجلين عبر الجذع إلى ذراع الرمي."},{"id":"tf-shot-put","sport":"Track and field","name":"Shot put (glide)","ar":"دفع الجلة","aliases":"track and field shot put throw glide","phase":"Glide through release","primary":["quads","glutes","chest","triceps","delt-f"],"secondary":["obliques","abs","lats","calves","forearms","serratus"],"moves":[["Leg drive and trunk rotation","Sagittal and transverse","Mediolateral (side to side) and vertical"],["Shoulder flexion, elbow extension","Sagittal","Mediolateral (side to side)"]],"force":"The legs and hips push into the ground and the hand pushes the shot upward and forward. Gravity acts downward on the shot.","diagram":"upforward","steps":[["Start","Back to the direction of the throw, shot at the neck."],["Glide","Move toward the front of the circle. The glide gives only about 10 to 15 percent of the distance."],["Power position","Weight is over the bent rear leg with the right foot turned across the circle."],["Putting action","The legs and hips drive upward and forward, then the arm extends the shot. This gives about 85 to 90 percent of the distance."],["Reverse","Switch feet to stay in the circle."],["Exit","Leave from the rear half of the circle after the shot lands."]],"phaseAr":"من الزحلقة حتى الإطلاق","forceAr":"تضغط الرجلان والوركان على الأرض وتدفع اليد الجلة إلى أعلى وأمام. وتؤثر الجاذبية في الجلة إلى أسفل.","stepsAr":[["البداية","الظهر نحو اتجاه الرمي والجلة عند الرقبة."],["الزحلقة","تحرك نحو مقدمة الدائرة. تضيف الزحلقة نحو 10 إلى 15 بالمئة فقط من المسافة."],["وضع القوة","الوزن فوق الرجل الخلفية المثنية، والقدم اليمنى مدارة عبر الدائرة."],["الدفع","تدفع الرجلان والوركان إلى أعلى وأمام، ثم تمد الذراع الجلة. توفر هذه الحركة نحو 85 إلى 90 بالمئة من المسافة."],["تبديل القدمين","بدل القدمين للبقاء داخل الدائرة."],["الخروج","اخرج من النصف الخلفي للدائرة بعد هبوط الجلة."]],"movesAr":[["دفع الرجلين ودوران الجذع","سهمي ومستعرض","عرضي ورأسي"],["ثني الكتف ومد المرفق","سهمي","عرضي من جانب إلى جانب"]],"about":"Pushing a heavy metal ball with one hand from the shoulder. The glide builds speed and the legs and trunk drive the push.","aboutAr":"دفع كرة معدنية ثقيلة بيد واحدة من الكتف. يبني الانزلاق السرعة وتقود الرجلان والجذع الدفع."},{"id":"tf-discus","sport":"Track and field","name":"Discus throw","ar":"رمي القرص","aliases":"track and field discus throw","phase":"Wind-up through release","primary":["quads","glutes","obliques","chest","delt-f"],"secondary":["abs","lats","hams","calves","forearms","triceps"],"moves":[["Whole-body rotation","Transverse","Vertical (longitudinal)"],["Shoulder horizontal adduction","Transverse","Vertical (longitudinal)"]],"force":"The legs and hips rotate against the ground; the discus leaves the hand forward and upward with spin.","diagram":"arc","steps":[["Grip and start","Hold the discus on the finger pads and stand at the back of the circle."],["Preliminary swing","A relaxed swing sets rhythm."],["Entry","Load and turn on the left leg, staying closed, with the discus behind the right hip."],["Turn","The left leg drives across the circle and the right foot lands and turns immediately."],["Power position","The left foot lands quickly at the front and the right foot keeps turning. The upper body stays closed."],["Throw","The hips and trunk lead the arm and the discus leaves off the index finger."],["Reverse and exit","Switch feet and leave from the rear half of the circle."]],"phaseAr":"من المرجحة التحضيرية حتى الإطلاق","forceAr":"تدور الرجلان والوركان بالارتكاز على الأرض، ويغادر القرص اليد إلى الأمام وأعلى مع الدوران.","stepsAr":[["المسك والبداية","أمسك القرص على وسائد الأصابع وقف في مؤخرة الدائرة."],["المرجحة التمهيدية","تضبط مرجحة مرتخية الإيقاع."],["الدخول","حمل الوزن ودر على الرجل اليسرى مع بقاء الجذع مغلقا والقرص خلف الورك الأيمن."],["الدوران","تدفع الرجل اليسرى عبر الدائرة وتهبط القدم اليمنى وتدور فورا."],["وضع القوة","تهبط القدم اليسرى سريعا في المقدمة وتواصل اليمنى الدوران. يبقى الجزء العلوي من الجسم مغلقا."],["الرمي","يسبق الوركان والجذع الذراع ويخرج القرص من إصبع السبابة."],["التبديل والخروج","بدل القدمين واخرج من النصف الخلفي للدائرة."]],"movesAr":[["دوران الجسم كله","مستعرض","رأسي، طولي"],["التقريب الأفقي للكتف","مستعرض","رأسي، طولي"]],"about":"Spinning inside a circle and throwing a flat disc with a sling-like arm motion. Rotation creates the speed.","aboutAr":"الدوران داخل دائرة ورمي قرص مسطح بحركة ذراع تشبه القذف. يصنع الدوران السرعة."},{"id":"tf-hammer","sport":"Track and field","name":"Hammer throw","ar":"رمي المطرقة","aliases":"track and field hammer throw","phase":"Wind-ups through release","primary":["quads","glutes","lowback","lats","traps"],"secondary":["hams","abs","obliques","calves","delt-r","forearms"],"moves":[["Whole-body rotation with counterbalance","Transverse","Vertical (longitudinal)"],["Hip and knee extension at release","Sagittal","Mediolateral (side to side)"]],"force":"The thrower pulls the hammer inward (centripetal force), then it leaves along a tangent after release. Gravity then acts downward.","diagram":"arc","steps":[["Start","Stand at the back of the circle with the hammer behind."],["Winds","Two preliminary swings set the rhythm. Push the hammer in double support and let it run in single support."],["Turns","Three or four turns across the circle."],["Release","The legs extend and the hammer is released."],["Recover","Balance and exit from the rear half of the circle."]],"phaseAr":"من المرجحات التمهيدية حتى الإطلاق","forceAr":"يسحب الرامي المطرقة نحو الداخل بقوة مركزية، ثم تنطلق في اتجاه مماسي بعد الإطلاق. وبعد ذلك تؤثر الجاذبية إلى أسفل.","stepsAr":[["البداية","قف في مؤخرة الدائرة والمطرقة خلفك."],["المرجحات","تضبط مرجحتان تمهيديتان الإيقاع. ادفع المطرقة في الارتكاز المزدوج واتركها تستمر في الارتكاز الفردي."],["الدورانات","ثلاث أو أربع دورات عبر الدائرة."],["الإطلاق","تمتد الرجلان وتطلق المطرقة."],["استعادة التوازن","اتزن واخرج من النصف الخلفي للدائرة."]],"movesAr":[["دوران الجسم كله مع موازنة الحركة","مستعرض","رأسي، طولي"],["مد الورك والركبة عند الإطلاق","سهمي","عرضي من جانب إلى جانب"]],"about":"Throwing a heavy ball on a wire handle after several fast spins. Centrifugal pull is controlled by the legs and trunk.","aboutAr":"رمي كرة ثقيلة متصلة بسلك ومقبض بعد عدة دورات سريعة. تتحكم الرجلان والجذع في قوة الجذب الطاردة."},{"id":"tf-marathon","sport":"Track and field","name":"Marathon running stride","ar":"خطوة الماراثون","aliases":"track and field long distance running run distance","phase":"Repeated stride cycle","primary":["quads","glutes","hams","calves"],"secondary":["hipflex","abs","lowback","adductors","glute-deep"],"moves":[["Hip, knee and ankle flexion and extension","Sagittal","Mediolateral (side to side)"]],"force":"The ground pushes back against the feet and the runner pushes down and backward. The ground reaction force is up and forward.","diagram":"forward","steps":[["Start","Standing or jogging at the start line."],["Settle into pace","Find an even, relaxed pace."],["Initial contact and braking","The foot lands and the quadriceps brake the body."],["Mid-stance support","The glutes, quadriceps and adductor magnus support the weight."],["Push-off","The calf muscles (soleus, gastrocnemius) provide most of the late-stance propulsion."],["Swing and flight","The hamstrings and hip flexors bring the leg through while the other leg lands."],["Race management (convention)","Keep rhythm, take fluid and stay upright as fatigue grows. This part is a coaching convention, not from the stride study."],["Finish and cool down","Cross the line, slow down and walk to recover."]],"phaseAr":"دورة خطوة متكررة","forceAr":"تدفع الأرض في الاتجاه المعاكس للقدمين، ويضغط العداء إلى أسفل وخلفا. ويكون رد فعل الأرض إلى أعلى وأمام.","stepsAr":[["البداية","وقوف أو هرولة عند خط البداية."],["الاستقرار على الإيقاع","اعثر على سرعة منتظمة ومريحة."],["التلامس الأول والفرملة","تهبط القدم وتساعد العضلة رباعية الرؤوس في فرملة الجسم."],["الدعم في منتصف الارتكاز","تدعم الألوية ورباعية الرؤوس والمقربة الكبرى وزن الجسم."],["الدفع","توفر عضلتا الساق، النعلية والتوأمية، معظم الدفع في أواخر الارتكاز."],["المرجحة والطيران","تمرر أوتار المأبض ومثنيات الورك الرجل إلى الأمام بينما تهبط الرجل الأخرى."],["إدارة السباق، توجيه تدريبي شائع","حافظ على الإيقاع وتناول السوائل وأبق الجسم منتصبا مع التعب. هذا توجيه تدريبي وليس نتيجة دراسة الخطوة."],["النهاية والتهدئة","اعبر الخط وخفف السرعة وامش للتعافي."]],"movesAr":[["ثني الورك والركبة والكاحل ومدها","سهمي","عرضي من function matching(){const q=norm(skillQuery.value);return SKILLS.filter(s=>!q||q.split(' ').every(w=>norm(s.name+' '+s.ar+' '+s.sport+' '+SPA(s.sport)+' '+s.aliases).includes(w)))}
const openSports=new Set();
function renderResults(auto=true){
  const q=norm(skillQuery.value),matches=matching();
  if(auto){const exact=matches.find(s=>norm(s.name)===q||norm(s.ar)===q);if(q&&(exact||matches.length===1)){selectSkill((exact||matches[0]).id,false)}else if(selectedSkill){selectedSkill=null;sel=null;fig.classList.remove('skill-mode');paint()}}
  skillResults.replaceChildren();
  const sports=[...new Set(SKILLS.map(s=>s.sport))];
  sports.forEach(sp=>{
    const list=(q?matches:SKILLS).filter(s=>s.sport===sp);if(!list.length)return;
    const isOpen=!!q||openSports.has(sp)||(selectedSkill&&selectedSkill.sport===sp);
    const box=document.createElement('div');box.className='sp'+(isOpen?' open':'');
    const h=document.createElement('button');h.type='button';h.className='sp-h';h.setAttribute('aria-expanded',isOpen);
    const nm=document.createElement('span');nm.textContent=ui(sp,SPA(sp));const cnt=document.createElement('span');cnt.className='n';cnt.textContent=list.length;const ch=document.createElement('span');ch.className='chev';ch.setAttribute('aria-hidden','true');
    h.append(nm,cnt,ch);
    const ul=document.createElement('div');ul.className='sp-list';
    list.forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=lang==='ar'?s.ar:s.name;b.setAttribute('aria-pressed',selectedSkill?.id===s.id);b.onclick=()=>selectSkill(s.id);ul.append(b)});
    h.onclick=()=>{const o=!box.classList.contains('open');box.classList.toggle('open',o);h.setAttribute('aria-expanded',o);o?openSports.add(sp):openSports.delete(sp)};
    box.append(h,ul);skillResults.append(box)});
  skillStatus.textContent=!q?ui(SKILLS.length+' skills in '+sports.length+' sports. Open a sport to pick a skill, or type to search.',SKILLS.length+' مهارة في '+sports.length+' رياضات. افتح رياضة لاختيار مهارة، أو اكتب للبحث.'):matches.length?ui(matches.length+' matching skill'+(matches.length===1?'':'s')+'. Choose one; Enter opens the first.',matches.length+' نتيجة. اختر مهارة؛ مفتاح الإدخال يفتح الأولى.'):ui('No matching skill. Try a sport name, an action, or Arabic.','لا توجد مهارة مطابقة. جرّب اسم رياضة أو حركة أو كلمة عربية.');
}
