<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-sport muscle map and skill search</title><style>html,body{margin:0;background:#0d0d0e}
.sport-app{--page:#0d0d0e;--card:#171718;--line:#2a2a2d;--text:#ededee;--mute:#9a9aa1;--pri:#e8372f;--sec:#fda36a;box-sizing:border-box;margin:0;padding:12px;background:var(--page);color:var(--text);font:500 15px/1.4 Saira,"Noto Sans Arabic",Arial,system-ui,sans-serif;color-scheme:dark;position:relative}
.sport-app *{box-sizing:border-box}

.sport-app .card{max-width:1100px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 10px;position:relative}
.sport-app .topbar{display:flex;align-items:center;gap:10px}

.sport-app .tools{display:flex;gap:8px}
.sport-app .lg{cursor:pointer;background:#242427;border:1px solid #4a4a50;border-radius:10px;padding:8px 12px;min-height:44px;min-width:44px;font:700 14px Saira,'Noto Sans Arabic',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.sport-app .lg[hidden]{display:none}
.sport-app .lg[aria-pressed=true],.sport-app .menu[aria-expanded=true]{background:var(--pri);border-color:var(--pri);color:#fff}
.sport-app .lg svg{display:block}
.sport-app .bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:12px}

.sport-app .legend{display:flex;gap:16px;color:#aaaab0;font-weight:700;font-size:14px}

.sport-app .shell{position:relative;margin-top:12px;min-height:520px}

.sport-app .zr[hidden]{display:none}
.sport-app .by{text-align:right;padding:10px 4px 2px;font:400 15px 'Mako Kaiju','Mako',sans-serif;color:var(--mute);letter-spacing:.04em}
/* sidebar */
.sport-app .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:25;opacity:0;pointer-events:none;transition:opacity .25s;border-radius:10px}
.sport-app .scrim.on{opacity:1;pointer-events:auto}
.sport-app .side{position:absolute;top:0;bottom:0;inset-inline-start:0;width:min(88%,330px);z-index:30;background:#131314;border:1px solid #3a3a3f;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.6);transform:translateX(-106%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s}
.sport-app.is-ar .side{transform:translateX(106%)}
.sport-app .side.open{transform:none;visibility:visible;transition:transform .28s ease}
.sport-app .side{overflow:hidden}.sport-app .side-in{position:sticky;top:0;max-height:min(100vh,100%);overflow:auto;padding:14px}
.sport-app .side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sport-app .side-head b{font-size:16px}

.sport-app .skill-search label{display:block;font-size:14px;font-weight:700;margin-bottom:5px}
.sport-app .search-row{display:flex;gap:8px}
.sport-app #skillQuery{width:100%;min-width:0;border:1px solid #52525b;background:#101011;color:#fff;border-radius:10px;padding:11px 12px;font:500 16px Saira,system-ui,sans-serif}

.sport-app #clearSkill{background:#242427;color:#eee;border:1px solid #52525b;border-radius:10px;padding:8px 14px;font:700 14px Saira,'Noto Sans Arabic',sans-serif;cursor:pointer;min-height:44px}
.sport-app #skillStatus{font-size:12px;color:#b4b4bc;margin:6px 0}
.sport-app .sp{border:1px solid #2f2f33;border-radius:12px;margin:8px 0;background:#19191b;overflow:hidden}
.sport-app .sp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:10px 14px;background:transparent;border:0;cursor:pointer;font:700 15px Saira,'Noto Sans Arabic',sans-serif;text-align:start}
.sport-app .sp-h .n{color:var(--mute);font-weight:600;font-size:13px;margin-inline-start:auto;margin-inline-end:8px}
.sport-app .sp-h .chev{width:10px;height:10px;border-inline-end:2px solid #b8b8c0;border-bottom:2px solid #b8b8c0;transform:rotate(45deg);transition:transform .2s;margin-bottom:3px}
.sport-app .sp-h[aria-expanded=true] .chev{transform:rotate(-135deg);margin-bottom:-3px}
.sport-app .sp-list{display:none;padding:0 8px 8px}
.sport-app .sp.open .sp-list{display:block}
.sport-app .sp-list button{display:block;width:100%;text-align:start;padding:10px 12px;min-height:44px;border:0;border-radius:8px;background:transparent;cursor:pointer;font:500 14px Saira,'Noto Sans Arabic',system-ui,sans-serif}
.sport-app .sp-list button:hover{background:#2a2a2d}
.sport-app .sp-list button[aria-pressed=true]{background:#762620;color:#fff}
.sport-app button:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* info panel */
.sport-app .info{padding:16px;border:1px solid var(--line);border-inline-start:3px solid var(--pri);border-radius:10px;background:#121213;min-height:150px;color:var(--text)}
.sport-app .info b{font-size:20px;display:block;font-style:italic}
.sport-app .info>*{opacity:0;animation:li .4s ease forwards;animation-delay:calc(var(--i,0)*110ms)}
@keyframes li{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.sport-app .info .sm{color:var(--text);margin:3px 0 0}
.sport-app .info small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.sport-app .tag{display:inline-block;margin-inline-start:8px;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:700;color:#111}
.sport-app .skill-kicker{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--sec)}
.sport-app .info .skill-heading{font-size:14px;font-weight:700;color:#ededee;margin-top:16px}
.sport-app .info ul{padding-inline-start:18px;margin:5px 0;color:#c4c4ca}
.sport-app .info .muscle-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.sport-app .muscle-list button{border:1px solid #6e3936;background:#2c1d1d;border-radius:5px;color:#ffb6af;padding:6px 8px;min-height:36px;cursor:pointer;font:500 13px Saira,'Noto Sans Arabic',system-ui,sans-serif;text-align:start}
.sport-app .muscle-list.secondary button{color:#ffd1b3;border-color:#775038;background:#2c241f}
.sport-app .info .mechanic{border-top:1px solid #333338;padding:7px 0;margin:0}
.sport-app .mechanic strong{font-size:13px;color:#dedee3}.sport-app .mechanic small{color:#b7b7c0;margin-top:2px}
.sport-app .info .skill-note{border-inline-start:2px solid #777780;padding:6px 9px;margin-top:12px;font-size:12px;color:#b8b8c1}
.sport-app .info details{margin-top:14px;font-size:12px;color:#b4b4bc}.sport-app .info summary{cursor:pointer;padding:10px 0;color:#ddd}.sport-app .info a{color:#ffc599;overflow-wrap:anywhere}
.sport-app .info .force-picture{height:70px;width:100%;margin:8px 0;flex:none}
.sport-app .steps{margin:6px 0 4px;padding-inline-start:22px;list-style:decimal}.sport-app .steps li{display:list-item;margin:0 0 7px;color:#dedee3;font-size:13px;line-height:1.4}.sport-app .steps strong{display:block;color:#fff}.sport-app .steps span{color:#c4c4cc}
.sport-app .info[dir="rtl"]{text-align:start}.sport-app .info[dir="rtl"] .steps li,.sport-app .info[dir="rtl"] .skill-note,.sport-app .info[dir="rtl"] p,.sport-app .info[dir="rtl"] small{line-height:1.8}

.sport-app .bo{fill:none;stroke:#3a3a3f;stroke-width:3.2;stroke-linejoin:round}
.sport-app .bf{fill:#1e1e21;stroke:none}
.sport-app .mb{fill:url(#gn);stroke:rgba(10,10,12,.75);stroke-width:.7;stroke-linejoin:round;transition:fill .2s}
.sport-app .sh,.sport-app .fg{pointer-events:none}
.sport-app .fs{fill:none;stroke-linecap:round}
.sport-app .fs.d{stroke:rgba(8,8,10,.4);stroke-width:.55}.sport-app .fs.l{stroke:rgba(255,225,215,.2);stroke-width:.5}.sport-app .fs.b{stroke:rgba(8,8,10,.55);stroke-width:1.1}
.sport-app .m{cursor:pointer;outline:none}
.sport-app .m:hover .mb{filter:brightness(1.25)}
.sport-app .m.p .mb{fill:url(#gp)}.sport-app .m.s .mb{fill:url(#gs)}
.sport-app .m[data-m=tendon] .mb{fill:url(#gt);stroke:#6f6652;stroke-width:.5}
.sport-app .m.p{filter:drop-shadow(0 0 5px rgba(232,55,47,.6))}
.sport-app .m.s{filter:drop-shadow(0 0 4px rgba(253,163,106,.4))}
.sport-app .m.sel .mb,.sport-app .m:focus-visible .mb{stroke:rgba(10,10,12,.75);stroke-width:.7;filter:brightness(1.3)}.sport-app .m,.sport-app .m *,.sport-app svg{outline:none!important;-webkit-tap-highlight-color:transparent}
.sport-app #fig.skill-mode:not(.sk-on) .m:not(.p):not(.s):not(.jt){opacity:.6}
.sport-app .dt{opacity:0;pointer-events:none;transition:opacity .45s .35s}
.sport-app .dt.on{opacity:1}
.sport-app .dt path{stroke:rgba(255,255,255,.4);stroke-width:.7;fill:none;stroke-linecap:round}
.sport-app .dt .ld{stroke:#fff;stroke-width:.45;opacity:.85}
.sport-app .dt text{font:700 6.5px Saira,'Noto Sans Arabic',sans-serif;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:1.8px;stroke-linejoin:round}
.sport-app .bn .mb{fill:url(#gb);stroke:#4a3e28;stroke-width:.7}
.sport-app .bn .cart{fill:#e3cfd2}
.sport-app .disc{fill:#c9bb9a;stroke:#4a3e28;stroke-width:.4}
.sport-app .dl{fill:none;stroke:#5e5238;stroke-width:.6;opacity:.65;pointer-events:none;stroke-linecap:round}
.sport-app .hl{fill:none;stroke:#fffaf0;stroke-width:.8;opacity:.6;pointer-events:none;stroke-linecap:round}
.sport-app .tooth{fill:#f7f5ec;stroke:#8d8470;stroke-width:.4;pointer-events:none}
.sport-app .sock{fill:#1c1a14;pointer-events:none}
.sport-app .bk{fill:none;stroke:#303034;stroke-width:3.4;stroke-linecap:round;pointer-events:none}
.sport-app .sct{font:700 9px Saira,'Noto Sans Arabic',sans-serif;fill:#8d8d93;text-anchor:middle;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.sport-app .jt{cursor:pointer}
.sport-app .lf path{fill:none;stroke:#ffd34a;stroke-width:1.1;stroke-linecap:round;opacity:0;pointer-events:none;transition:opacity .2s;filter:drop-shadow(0 0 1.2px #000)}
.sport-app #fig.lfa .lf path{opacity:.7}.sport-app .lf path.on{opacity:1!important;stroke-width:1.7}
.sport-app #fig.skill-mode .lf path{opacity:0}
.sport-app #fig.skill-mode.lfa .lf path.on{opacity:.9}
.sport-app #fig.skill-mode:not(.lfa) .lf path.on{opacity:0!important}
.sport-app .jc{fill:rgba(255,255,255,.14);stroke:#ff8a80;stroke-width:1.1;pointer-events:none;transition:fill .2s}
.sport-app .jt:hover .jc{fill:rgba(255,138,128,.5)}
.sport-app .m.jt.p .jc{fill:#e8372f;stroke:rgba(10,10,12,.75)}

@media(max-width:430px){.sport-app #menuLabel,.sport-app #title{display:none}.sport-app .layout{display:flex;flex-direction:column}.sport-app .layout .info,.sport-app .stage{width:100%;max-width:none;box-sizing:border-box}.sport-app .topbar h1,.sport-app h1{font-size:16px}}

.sport-app .bn{filter:url(#bonelit)}

.sport-app{display:block;border-radius:10px;padding:12px;color-scheme:dark;overflow:hidden}

@media(max-width:360px){.sport-app{padding:6px}.sport-app .topbar{gap:4px;flex-wrap:wrap}.sport-app .tools{gap:4px;flex-wrap:wrap;min-width:0;max-width:100%}}

</div><script>

function initializeAnatomy(){
/* ===== anatomy drawing kit: smooth organic shapes ===== */
const f1=v=>(Math.round(v*10)/10).toString(),pt=p=>f1(p[0])+','+f1(p[1]);
const SHAPES=[];
function blobD(pts,k){k=k||1;const n=pts.length;let d='M'+pt(pts[0]);
 for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
  d+='C'+pt([p1[0]+(p2[0]-p0[0])/6*k,p1[1]+(p2[1]-p0[1])/6*k])+' '+pt([p2[0]-(p3[0]-p1[0])/6*k,p2[1]-(p3[1]-p1[1])/6*k])+' '+pt(p2)}
 return d+'Z'}
function crs(P,n){const o=[];for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];
  for(let t=0;t<n;t++){const s=t/n,s2=s*s,s3=s2*s;o.push([0,1].map(k=>.5*(2*p1[k]+(-p0[k]+p2[k])*s+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*s2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*s3)))}}
 o.push(P[P.length-1]);return o}
/* centreline sampling with interpolated half-widths: returns [{x,y,nx,ny,w,u}] */
function spine(P,W,n){const Q=crs(P,n||8),N=Q.length,L=[0];for(let i=1;i<N;i++)L.push(L[i-1]+Math.hypot(Q[i][0]-Q[i-1][0],Q[i][1]-Q[i-1][1]));
 const tot=L[N-1]||1;
 // widths are given per control point; control points sit at index i*(n||8)
 const step=n||8;
 return Q.map((p,i)=>{const a=Q[Math.max(0,i-1)],b=Q[Math.min(N-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  const g=i/step,k=Math.min(W.length-2,Math.floor(g)),t=Math.min(1,g-k),s=t*t*(3-2*t);
  const w=W[k]+(W[Math.min(W.length-1,k+1)]-W[k])*s;
  return {x:p[0],y:p[1],nx:-dy,ny:dx,w,u:L[i]/tot}})}
function bandPts(P,W){const S=spine(P,W,8),Lp=[],Rp=[];
 S.forEach((s,i)=>{if(i%2&&i<S.length-1)return;Lp.push([s.x+s.nx*s.w,s.y+s.ny*s.w]);Rp.push([s.x-s.nx*s.w,s.y-s.ny*s.w])});
 const a=S[0],z=S[S.length-1];let pts=[];
 if(W[0]<.9){pts.push([a.x,a.y]);Lp.shift();Rp.shift()}
 pts=pts.concat(Lp);
 if(W[W.length-1]<.9){pts.pop();pts.push([z.x,z.y])}
 const Rr=Rp.slice().reverse();if(W[W.length-1]<.9)Rr.shift();
 return pts.concat(Rr)}

duction","Transverse approximation","Vertical (longitudinal)"],["Elbow extension and wrist flexion","Sagittal approximation","Mediolateral (side to side)"]],"force":"Hands apply force forward and downward. At the bounce, the floor applies an upward contact force to the ball; friction can also change its horizontal motion.","diagram":"downforward","steps":[["Ready position","Balanced stance, ball at chest or waist height."],["Choose the bounce point","Aim about three-quarters of the way to the receiver so the ball bounces waist high."],["Push down and forward","Elbows and wrists extend while the step transfers weight forward."],["Release","The ball leaves downward and forward with backspin."],["Bounce and arrival","The ball rises to the receiver at about waist height."],["Recover","Return to the ready stance."]],"phaseAr":"دفع باليدين إلى أسفل وأمام","forceAr":"تدفع اليدان الكرة إلى الأمام وأسفل. وعند الارتداد تؤثر الأرض بقوة تلامس إلى أعلى في الكرة، وقد يغير الاحتكاك حركتها الأفقية أيضا.","stepsAr":[["وضع الاستعداد","وقفة متزنة والكرة عند ارتفاع الصدر أو الخصر."],["اختيار نقطة الارتداد","استهدف نقطة تبعد نحو ثلاثة أرباع المسافة إلى المستلم كي ترتد الكرة إلى ارتفاع خصره."],["الدفع لأسفل وأمام","يمتد المرفقان والرسغان بينما تنقل الخطوة الوزن إلى الأمام."],["إطلاق الكرة","تخرج الكرة إلى أسفل وأمام بدوران خلفي."],["الارتداد والوصول","ترتفع الكرة نحو المستلم إلى مستوى الخصر تقريبا."],["العودة","عد إلى وقفة الاستعداد."]],"movesAr":[["الدفع: التقريب الأفقي للكتف","تقريب للمستوى المستعرض","رأسي، طولي"],["مد المرفق وثني الرسغ","تقريب للمستوى السهمي","عرضي من جانب إلى جانب"]],"about":"A two-handed pass that hits the floor before reaching the teammate. It helps get the ball past a defender's raised hands.","aboutAr":"تمريرة بكلتا اليدين ترتطم بالأرض قبل أن تصل إلى الزميل. تساعد على تمرير الكرة أسفل يدي المدافع."},{"id":"overhead-pass","sport":"Basketball","name":"Overhead pass","ar":"التمريرة من فوق الرأس","aliases":"over head pass","phase":"Forward release from above the head","primary":["triceps","delt-f","forearms"],"secondary":["chest","serratus","traps","abs","obliques","rotator"],"moves":[["Elbow extension and arm movement toward release","Mostly sagittal approximation","Mediolateral; shoulder motion varies"]],"force":"Hands apply force toward the receiver, often forward and slightly downward. The exact direction depends on the target height and passing distance.","diagram":"forward","steps":[["Ready position","Balanced stance with the ball in both hands."],["Raise","Bring the ball directly above the forehead with both hands on the sides. Do not take it behind the head."],["Step and throw","A forward step shifts weight while the elbows extend and the wrists snap forward."],["Follow-through","Hands finish extended toward the target (aim for the receiver's chin)."],["Recover","Return to a balanced stance, ready to move."]],"phaseAr":"إطلاق أمامي من فوق الرأس","forceAr":"تدفع اليدان الكرة نحو المستلم، غالبا إلى الأمام وأسفل قليلا. يعتمد الاتجاه الدقيق على ارتفاع الهدف ومسافة التمرير.","stepsAr":[["وضع الاستعداد","وقفة متزنة والكرة باليدين."],["الرفع","ارفع الكرة مباشرة فوق الجبهة مع وضع اليدين على جانبيها. لا ترجع بها خلف الرأس."],["الخطوة والرمي","تنقل خطوة أمامية الوزن مع مد المرفقين ودفع الرسغين سريعا إلى الأمام."],["المتابعة","تنتهي اليدان ممدودتين نحو الهدف، مع التصويب نحو ذقن المستلم."],["العودة","عد إلى وقفة متزنة استعدادا للحركة."]],"movesAr":[["مد المرفق وحركة الذراع نحو الإطلاق","تقريب سهمي غالبا","عرضي، وتختلف حركة الكتف"]],"about":"A two-handed pass thrown from above the head. It is used for long passes or over a defender.","aboutAr":"تمريرة بكلتا اليدين من فوق الرأس. تستخدم للتمريرات الطويلة أو لتجاوز المدافع."},{"id":"dribble","sport":"Basketball","name":"Dribble","ar":"المحاورة (الطبطبة)","aliases":"dribbling pound dribble ball handling","phase":"Stationary downward push and ball control","primary":["forearms","triceps"],"secondary":["delt-f","abs","obliques","quads","glutes"],"moves":[["Elbow extension and wrist/finger flexion","Mostly sagittal approximation","Mediolateral; finger axes are local"]],"force":"The hand pushes the ball downward. The floor applies an upward contact force during the bounce. Ball travel is not a constant force vector.","diagram":"down","steps":[["Ready stance","Knees bent, head up, ball in front of the dribbling hand."],["Push down","Wrist and elbow extend and the fingertips push the ball to the floor."],["Ball rebounds","Let the ball rise without slapping it."],["Hand receives","The hand rides up with the ball and absorbs its rise."],["Repeat","Keep a steady low rhythm."],["Finish","Gather the ball with both hands and stop in a balanced stance."]],"phaseAr":"الدفع إلى أسفل والتحكم بالكرة من الثبات","forceAr":"تدفع اليد الكرة إلى أسفل. وتؤثر الأرض بقوة تلامس إلى أعلى أثناء الارتداد. مسار الكرة ليس متجه قوة ثابتا.","stepsAr":[["وقفة الاستعداد","الركبتان مثنيتان والرأس مرفوع والكرة أمام يد المحاورة."],["الدفع لأسفل","يمتد الرسغ والمرفق وتدفع أطراف الأصابع الكرة نحو الأرض."],["ارتداد الكرة","اترك الكرة ترتفع دون صفعها."],["استقبال اليد","تصعد اليد مع الكرة وتمتص ارتفاعها."],["التكرار","حافظ على إيقاع منخفض ومنتظم."],["الإنهاء","اجمع الكرة باليدين وتوقف في وقفة متزنة."]],"movesAr":[["مد المرفق وثني الرسغ والأصابع","تقريب سهمي غالبا","عرضي، ومحاور الأصابع موضعية"]],"about":"Bouncing the ball with one hand while keeping control. Short pushes from the fingers and wrist keep the ball low and close.","aboutAr":"ارتداد الكرة بيد واحدة مع التحكم فيها. دفعات قصيرة من الأصابع والرسغ تبقي الكرة منخفضة وقريبة."},{"id":"crossover","sport":"Basketball","name":"Crossover dribble","ar":"المحاورة بتغيير الاتجاه (كروس أوفر)","aliases":"cross over crossover cross-over كروس اوفر","phase":"Hand switch with a lateral change of direction","primary":["forearms","quads","glutes","calves"],"secondary":["triceps","adductors","glute-deep","abs","obliques"],"moves":[["Lateral hip movement and control","Frontal (coronal)","Anteroposterior (front to back)"],["Hip/trunk turn and hand transfer","Transverse plus sagittal components","Vertical plus local arm axes"]],"force":"The hand drives the ball down and across. The feet push against the floor to brake and redirect the body laterally.","diagram":"side","steps":[["Ready and dribble","Low stance with the ball in one hand."],["Plant and protect","Plant the foot on the ball side as if going that way. The near shoulder and arm go forward and down to protect the ball."],["Cross the ball","A low, quick push sends the ball across the front of the body to the other hand."],["Change direction","Push off the planted foot and go the other way."],["Accelerate","The new lead leg steps past the defender while the free arm protects the ball."],["Resume","Return to a controlled dribble or ready stance."]],"phaseAr":"تبديل اليد مع تغيير الاتجاه جانبيا","forceAr":"تدفع اليد الكرة إلى أسفل وعبر الجسم. وتضغط القدمان على الأرض لفرملة الجسم وتغيير اتجاهه جانبيا.","stepsAr":[["الاستعداد والمحاورة","وقفة منخفضة والكرة في إحدى اليدين."],["الارتكاز والحماية","ثبت قدم جهة الكرة وكأنك ستتحرك نحوها. يتقدم الكتف والذراع القريبان وينخفضان لحماية الكرة."],["نقل الكرة","تدفع حركة منخفضة وسريعة الكرة أمام الجسم إلى اليد الأخرى."],["تغيير الاتجاه","ادفع بالقدم المرتكزة وتحرك في الاتجاه الآخر."],["التسارع","تتقدم الرجل القائدة الجديدة متجاوزة المدافع مع حماية الكرة بالذراع الحرة."],["الاستمرار","عد إلى محاورة مضبوطة أو وقفة استعداد."]],"movesAr":[["الحركة الجانبية للورك والتحكم فيها","جبهي، إكليلي","أمامي خلفي"],["دوران الورك والجذع ونقل الكرة بين اليدين","مكونات مستعرضة وسهمية","رأسي مع محاور موضعية للذراع"]],"about":"A dribble where the ball switches from one hand to the other in front of the body. It changes direction to get past a defender.","aboutAr":"محاورة تنتقل فيها الكرة من يد إلى الأخرى أمام الجسم. تغير الاتجاه لتجاوز المدافع."},{"id":"defensive-slide","sport":"Basketball","name":"Defensive slide","ar":"الخطوة الدفاعية الجانبية","aliases":"defense defence lateral shuffle defensive shuffle","phase":"Lateral push-off and receiving-leg braking","primary":["glute-deep","adductors","quads"],"secondary":["glutes","calves","hams","abs","obliques"],"moves":[["Hip abduction/adduction and pelvic control","Frontal (coronal)","Anteroposterior (front to back)"],["Bent-knee support and ankle push-off","Sagittal components","Mediolateral (side to side)"]],"force":"The pushing foot presses into the floor opposite the intended travel. The ground reaction accelerates the body sideways; the receiving leg helps brake it.","diagram":"side","steps":[["Defensive stance","Low and wide, chest up, hands active."],["Push off","The trailing leg pushes the body sideways."],["Lead step","The lead foot steps in the travel direction without crossing the feet."],["Close","The trailing foot slides back to restore a wide base."],["Repeat","Keep the hips low as the direction changes."],["Stop","Plant and return to the neutral defensive stance."]],"phaseAr":"الدفع الجانبي وفرملة الرجل المستقبلة","forceAr":"تضغط قدم الدفع على الأرض عكس اتجاه الحركة المقصود. يسرع رد فعل الأرض الجسم جانبيا، وتساعد الرجل المستقبلة في فرملته.","stepsAr":[["الوقفة الدفاعية","وقفة منخفضة وواسعة، والصدر مرفوع واليدان نشطتان."],["الدفع","تدفع الرجل الخلفية الجسم جانبيا."],["خطوة الرجل القائدة","تخطو القدم القائدة في اتجاه الحركة دون تقاطع القدمين."],["الضم","تنزلق القدم الخلفية لاستعادة قاعدة الارتكاز الواسعة."],["التكرار","أبق الوركين منخفضين عند تغيير الاتجاه."],["التوقف","ثبت القدمين وعد إلى الوقفة الدفاعية المحايدة."]],"movesAr":[["تبعيد الورك وتقريبه والتحكم في الحوض","جبهي، إكليلي","أمامي خلفي"],["الدعم بركبة مثنية والدفع بالكاحل","مكونات سهمية","عرضي من جانب إلى جانب"]],"about":"A sideways step used to stay in front of the attacker. You push off one leg and the other leg brakes, without crossing your feet.","aboutAr":"خطوة جانبية للبقاء أمام المهاجم. تدفع إحدى الرجلين الأرض وتكبح الأخرى الحركة، دون تقاطع القدمين."},{"id":"rebound","sport":"Basketball","name":"Rebound jump","ar":"القفز لالتقاط الكرة المرتدة (ريباوند)","aliases":"rebounding
