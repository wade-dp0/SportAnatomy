<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

h1{margin:0 0 14px;font:italic 800 24px/1.1 Saira,sans-serif;text-transform:uppercase;letter-spacing:.01em}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:#0f0f10;border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:8px 16px;border-radius:6px;font-weight:700;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--pri);color:#fff}
.seg button:focus-visible,.chips button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.legend{display:flex;gap:16px;color:var(--mute);font-weight:700;font-size:14px}
.legend i{display:inline-block;width:14px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chips button{all:unset;cursor:pointer;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-weight:700;font-size:14px}
.chips button[aria-pressed=true]{color:var(--text);border-color:#5a5a60;background:#242427}
svg{display:block;width:100%;height:auto;max-height:78vh;margin:0 auto;overflow:hidden}
.layout{display:grid;grid-template-columns:240px 1fr;gap:16px;margin-top:14px;align-items:start}
.stage{min-width:0;position:relative}
.zr{position:absolute;top:6px;right:6px;z-index:2;cursor:pointer;background:#242427;color:var(--text);border:1px solid #4a4a50;border-radius:6px;padding:5px 10px;font:700 13px Saira,sans-serif}
.zr[hidden]{display:none}
.dt{opacity:0;pointer-events:none;transition:opacity .45s .35s}
.dt.on{opacity:1}
.dt path{stroke:rgba(255,255,255,.4);stroke-width:.7;fill:none;stroke-linecap:round}
.dt .ld{stroke:#fff;stroke-width:.45;opacity:.85}
.dt text{font:700 6.5px Saira,'Noto Sans Arabic',sans-serif;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:1.8px;stroke-linejoin:round}
@media (max-width:640px){.layout{grid-template-columns:132px 1fr;gap:8px}.layout .info{padding:10px;font-size:13px;min-height:120px}.layout .info b{font-size:16px}.card{padding:14px 10px}}
.base{fill:#19191b;stroke:#303035;stroke-width:1.5}
.guide{stroke:#55555b;stroke-width:1;stroke-dasharray:2 3;fill:none}
.mb{fill:url(#gn);stroke:#0b0b0c;stroke-width:1.3;stroke-linejoin:round;transition:fill .2s}
.mf{pointer-events:none;opacity:.9}
.m{cursor:pointer;outline:none}
.m:hover .mb{filter:brightness(1.3)}
.m.p .mb{fill:url(#gp)} .m.s .mb{fill:url(#gs)}
.m[data-m=tendon] .mb{fill:url(#gt)}
.m[data-m=tendon] .mf{opacity:.3}
.m[data-m=tendon] .mb{stroke-width:.5}
.m.p{filter:drop-shadow(0 0 5px rgba(232,55,47,.55))}
.m.s{filter:drop-shadow(0 0 4px rgba(253,163,106,.35))}
.m.sel .mb,.m:focus-visible .mb{stroke:#fff;stroke-width:1.8}
.lbl{display:flex;justify-content:space-around;color:var(--mute);font-weight:700;letter-spacing:.12em;font-size:13px;margin-top:2px}
.info{position:sticky;top:12px;padding:16px;border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:8px;background:#121213;min-height:150px}
.info b{font-size:20px;display:block;font-style:italic}
.info>*{opacity:0;animation:li .4s ease forwards;animation-delay:calc(var(--i,0)*110ms)}
@keyframes li{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.info .sm{color:var(--text);margin:3px 0 0}
.info small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.lg{order:2;cursor:pointer;background:#242427;color:var(--text);border:1px solid #4a4a50;border-radius:8px;padding:8px 14px;font:700 14px Saira,'Noto Sans Arabic',sans-serif}
:root[lang=ar] h1,:root[lang=ar] .info b{font-style:normal;text-transform:none}
.bn .mb{fill:url(#gb);stroke:#4a3e28;stroke-width:.7}
.bn .cart{fill:#e3cfd2}
.disc{fill:#c9bb9a;stroke:#4a3e28;stroke-width:.4}
.dl{fill:none;stroke:#5e5238;stroke-width:.6;opacity:.65;pointer-events:none;stroke-linecap:round}
.hl{fill:none;stroke:#fffaf0;stroke-width:.8;opacity:.6;pointer-events:none;stroke-linecap:round}
.tooth{fill:#f7f5ec;stroke:#8d8470;stroke-width:.4;pointer-events:none}
.sock{fill:#15151a;pointer-events:none}
.lg svg{display:block}
.by{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));font:400 15px 'Mako Kaiju','Mako',sans-serif;color:var(--mute);letter-spacing:.04em;pointer-events:none;z-index:5}
.bk{fill:none;stroke:#2c2c31;stroke-width:3.4;stroke-linecap:round;pointer-events:none}
.sct{font:700 9px Saira,'Noto Sans Arabic',sans-serif;fill:#8d8d93;text-anchor:middle;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.lg[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff}
:root[lang=ar] .info{direction:rtl;text-align:right;border-left:1px solid var(--line);border-right:3px solid var(--pri)}
.info{max-height:calc(100vh - 24px);overflow:auto}
.tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:700;color:#111}
.info p{margin:4px 0 0;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.info>*{animation:none!important;opacity:1!important}}
